<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lv.OPS">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F3F8F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060E0E" media="(prefers-color-scheme: dark)">
<title>Lv.OPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F9; --card:#FFFFFF; --ink:#18202E; --sub:#667286; --faint:#9AA3B2; --line:#E3E6EB; --soft:#EEF0F3;
  --tape:#FFC81E; --tape-ink:#18202E; --alert:#D6342B; --alert-bg:#FCEBE9; --wait:#2C6BB0; --wait-bg:#E6EFF9;
  --ok:#2A8A55; --ok-bg:#E4F4EA; --shadow:0 1px 2px rgba(24,32,46,.06),0 6px 20px rgba(24,32,46,.06);
  --font:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --nav:62px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F131A; --card:#181E29; --ink:#E8EBF1; --sub:#9AA4B6; --faint:#6B7588; --line:#262E3C; --soft:#1F2633;
    --alert:#FF6B57; --alert-bg:#3A1D1A; --wait:#82B4EC; --wait-bg:#18283B; --ok:#5CC68B; --ok-bg:#15301F; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#0F131A; --card:#181E29; --ink:#E8EBF1; --sub:#9AA4B6; --faint:#6B7588; --line:#262E3C; --soft:#1F2633;
  --alert:#FF6B57; --alert-bg:#3A1D1A; --wait:#82B4EC; --wait-bg:#18283B; --ok:#5CC68B; --ok-bg:#15301F; --shadow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;
  padding-bottom:calc(var(--nav) + 130px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}

/* header */
.hd{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 18px 6px;max-width:780px;margin:0 auto}
.hd h1{margin:0;font-size:30px;line-height:1.2;font-weight:700;letter-spacing:.02em}
.hd .date{font-size:14px;color:var(--sub);margin-top:2px}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
main{padding:0 16px 24px;max-width:780px;margin:0 auto}
.view{display:none}.view.on{display:block}

/* tape = signature */
.tape{display:inline-flex;align-items:baseline;gap:6px;background:var(--tape);color:var(--tape-ink);white-space:nowrap;
  padding:5px 16px 4px;clip-path:polygon(0 0,100% 0,97% 25%,100% 50%,97% 75%,100% 100%,0 100%,3% 75%,0 50%,3% 25%)}
.tape .d{font-family:var(--display);font-size:22px;line-height:1}
.tape .l{font-size:12px;font-weight:700}
.tape.sm{padding:2px 10px 1px}.tape.sm .d{font-size:14px}
.shows{display:flex;gap:12px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.shows::-webkit-scrollbar{display:none}
.shows .nx{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;border:0;background:none;padding:0;text-align:left}
.shows .nx em{font-style:normal;font-size:13px;color:var(--sub);padding-left:4px;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* summary card */
.plan{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);margin-top:14px;overflow:hidden}
.plan button{border:0;background:none;padding:12px 8px 10px;text-align:center;border-left:1px solid var(--line)}
.plan button:first-child{border-left:0}
.plan b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;font-weight:400}
.plan span{font-size:12.5px;color:var(--sub)}
.plan .bad b{color:var(--alert)}
.plan .w b{color:var(--wait)}
.progress{height:4px;background:var(--soft);grid-column:1/-1}
.progress i{display:block;height:100%;background:var(--ok);transition:width .3s}

/* sections */
.sec{margin-top:22px}
.sec h2{font-size:15px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
.sec h2 small{font-weight:400;color:var(--sub);font-size:13px}
.sec.alert h2{color:var(--alert)}
.empty{color:var(--sub);font-size:14px;padding:6px 2px}
.linkbtn{background:none;border:0;padding:0;color:var(--sub);font-size:13px;text-decoration:underline;margin-left:auto}

/* task rows with swipe */
ul.tasks{list-style:none;margin:0;padding:0;background:var(--card);border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.task{position:relative;border-top:1px solid var(--line);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.task:first-child{border-top:0}
.task .under{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:14px;font-weight:700}
.task .under .r{color:var(--ok)}.task .under .l{color:#8A6400}
.task.sw-r .under{background:var(--ok-bg)}.task.sw-l .under{background:#FFF3C9}
.task .face{position:relative;display:flex;gap:12px;padding:13px 14px;background:var(--card);align-items:flex-start;transition:transform .18s ease}
.task.dragx .face{transition:none}
.task.issue .face{box-shadow:inset 4px 0 0 var(--alert)}
.check{flex:0 0 24px;height:24px;border-radius:50%;border:2px solid var(--faint);background:transparent;margin-top:1px;display:grid;place-items:center;padding:0}
.check svg{width:14px;height:14px;opacity:0;color:#fff}
.done .check{background:var(--ok);border-color:var(--ok)}.done .check svg{opacity:1}
.done .ttl{text-decoration:line-through;color:var(--sub)}
.tbody{flex:1;min-width:0;cursor:pointer}
.ttl{font-weight:500;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;font-size:12.5px;color:var(--sub)}
.meta span{padding:1px 7px;border-radius:6px;background:var(--soft);line-height:1.6}
.meta .proj{background:transparent;border:1px solid var(--line)}
.meta .late{background:var(--alert-bg);color:var(--alert);font-weight:700}
.meta .today{background:var(--tape);color:var(--tape-ink);font-weight:700}
.meta .wt{background:var(--wait-bg);color:var(--wait);font-weight:700}
.meta .cmp{background:transparent;color:#A8740A;border:1px dashed #D6A23A}
.iss{margin-top:5px;font-size:12.5px;color:var(--alert);font-weight:700}
.hint{font-size:12.5px;color:var(--faint);margin:8px 2px 0}

/* close day */
.closeday{margin-top:26px;display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.closeday p{margin:0;font-size:13.5px;color:var(--sub);flex:1}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--ink);background:transparent;font-weight:700;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.danger{border-color:var(--alert);color:var(--alert)}
.btn.sm{height:36px;padding:0 12px;font-size:14px}

/* timeline */
.tl-wrap{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tl{display:grid;position:relative}
.tl .lab{position:sticky;left:0;z-index:2;background:var(--card);border-right:1px solid var(--line);padding:8px 10px;font-size:13px;font-weight:700;display:flex;align-items:center;min-height:56px;line-height:1.3}
.tl .lab small{display:block;font-weight:400;color:var(--sub);font-size:11.5px}
.tl .dh{font-size:11px;text-align:center;color:var(--sub);padding:6px 0 4px;border-bottom:1px solid var(--line);line-height:1.2}
.tl .dh b{display:block;font-size:13px;color:var(--ink)}
.tl .dh.we{background:var(--soft)}.tl .dh.td b{background:var(--ink);color:var(--paper);border-radius:6px;margin:0 4px}
.tl .corner{position:sticky;left:0;z-index:3;background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tl .cell{border-bottom:1px solid var(--line);position:relative;min-height:56px}
.tl .cell.we{background:var(--soft)}
.tl .cell.td{background:rgba(255,200,30,.14)}
.tl .span{position:absolute;top:50%;height:6px;margin-top:-3px;background:var(--line);border-radius:3px;z-index:0}
.tl .dot{position:absolute;top:50%;left:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid var(--card);background:var(--ink);color:var(--paper);font-size:11px;font-weight:700;display:grid;place-items:center;z-index:1;padding:0}
.tl .dot.wait{background:var(--wait)}.tl .dot.late{background:var(--alert)}.tl .dot.done{background:var(--ok)}
.tl .show{position:absolute;inset:6px 2px;background:var(--tape);color:var(--tape-ink);font-family:var(--display);font-size:11px;display:grid;place-items:center;z-index:1;
  clip-path:polygon(0 0,100% 0,90% 50%,100% 100%,0 100%,10% 50%)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--sub);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}

/* board */
.bfilter{display:flex;gap:8px;align-items:center;margin-top:12px}
.bfilter select{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 10px;font-size:15px;max-width:100%}
.board{display:flex;gap:12px;overflow-x:auto;padding:12px 2px 16px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.kcol{flex:0 0 80%;max-width:290px;background:var(--soft);border-radius:16px;padding:10px;scroll-snap-align:start;min-height:260px;border:2px dashed transparent}
@media (min-width:780px){.kcol{flex:1 1 0;max-width:none}}
.kcol.over{border-color:var(--ink)}
.kcol h3{margin:2px 4px 10px;font-size:14px;display:flex;align-items:center;gap:6px}
.kcol h3 i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.kcol h3 span{color:var(--sub);font-weight:400;margin-left:auto}
.kcol[data-st="inbox"] h3 i{background:var(--tape)}.kcol[data-st="doing"] h3 i{background:var(--ink)}
.kcol[data-st="wait"] h3 i{background:var(--wait)}.kcol[data-st="done"] h3 i{background:var(--ok)}
.kcard{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 4px;margin-bottom:8px;box-shadow:var(--shadow)}
.kcard.issue{box-shadow:inset 4px 0 0 var(--alert),var(--shadow)}
.kcard.dragging{opacity:.3}
.handle{flex:0 0 28px;border:0;background:transparent;color:var(--faint);font-size:18px;line-height:1;touch-action:none;padding:2px 0;cursor:grab}
.ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;box-shadow:0 16px 36px rgba(0,0,0,.25)}

/* projects */
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.phead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pname{font-weight:700;font-size:17px;line-height:1.35}
.psub{font-size:13px;color:var(--sub);margin-top:2px}
.mods{display:flex;gap:6px;margin-top:8px}
.mods span{font-size:12px;border:1px solid var(--ink);border-radius:6px;padding:0 7px}
.bar{height:6px;background:var(--soft);border-radius:3px;margin:12px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.stats{display:flex;gap:14px;margin-bottom:10px;font-size:13px;color:var(--sub)}
.stats b{color:var(--ink);font-size:15px}.stats .bad b{color:var(--alert)}
.pcard ul.tasks{box-shadow:none}
.foot{margin-top:28px;font-size:13px;color:var(--sub)}
.foot button{background:none;border:0;color:var(--sub);text-decoration:underline;padding:0}

/* capture dock */
.dock{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px));z-index:40;padding:6px 12px 10px;background:var(--paper)}
.dock::before{content:"";position:absolute;left:0;right:0;top:-18px;height:18px;background:linear-gradient(to top,var(--paper),transparent);pointer-events:none}
.dock-in{max-width:780px;margin:0 auto}
.pv{display:flex;flex-wrap:wrap;gap:6px;margin:0 2px 6px;min-height:0}
.pv button{font-size:12.5px;padding:3px 8px;border-radius:8px;border:0;background:var(--tape);color:var(--tape-ink);font-weight:700}
.pv button s{font-weight:400;opacity:.6;text-decoration:none;margin-left:4px}
.pv button.off{background:var(--soft);color:var(--sub);text-decoration:line-through}
.pv .multi{font-size:12.5px;color:var(--sub);align-self:center}
.capbox{display:flex;gap:8px;align-items:flex-end;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:6px 6px 6px 14px;box-shadow:0 8px 24px rgba(24,32,46,.12)}
.capbox textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;height:40px;max-height:120px;padding:8px 0;font-size:17px;line-height:1.45;outline:none}
.capbox textarea::placeholder{color:var(--faint)}
.capbox button{flex:0 0 auto;height:40px;padding:0 16px;border:0;border-radius:13px;background:var(--ink);color:var(--paper);font-weight:700}
.srcrow{display:none;gap:6px;margin:8px 2px 0;align-items:center}
.dock.focus .srcrow{display:flex}
.srcrow span{font-size:12.5px;color:var(--sub)}
.srcrow button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--sub)}
.srcrow button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
body.kb nav.tabs{display:none}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;height:var(--nav);border:0;background:transparent;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700}
nav.tabs .badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;padding:0 5px;border-radius:9px;background:var(--alert);color:#fff;font-size:11px;line-height:18px;font-weight:700}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:60;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--card);border-radius:22px 22px 0 0;
  max-height:90vh;overflow-y:auto;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
@media (min-width:780px){.sheet{left:50%;right:auto;width:580px;margin-left:-290px}}
@media (prefers-reduced-motion:reduce){.sheet,.task .face{transition:none}}
.sheet h3{margin:0 0 14px;font-size:17px}
.fld{margin-bottom:14px}
.fld label,.fld .lb{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 12px;font-size:16px}
.fld textarea{min-height:60px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:7px 12px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.raw{font-size:13px;color:var(--sub);background:var(--paper);border-radius:12px;padding:8px 10px;word-break:break-word}
.row2{display:flex;gap:10px}.row2 .fld{flex:1;min-width:0}
.acts{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:var(--paper);border-radius:12px;padding:10px 12px}
.chk input{width:20px;height:20px;margin-top:2px;flex:0 0 auto}
.chk small{display:block;color:var(--sub);font-size:12.5px}
.search input{width:100%;height:46px;border-radius:12px;border:2px solid var(--ink);background:var(--paper);padding:0 14px;font-size:17px}

/* slots (手配枠) */
.slots{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.slh{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--soft);font-size:14px;font-weight:700;flex-wrap:wrap}
.slh .kind{font-size:12px;border-radius:6px;padding:1px 8px;background:var(--ink);color:var(--paper)}
.slh .kind.ns{background:transparent;color:var(--sub);border:1px solid var(--line)}
.slh .tot{font-weight:400;color:var(--sub);font-size:13px}
.slh .sp{margin-left:auto;display:flex;gap:6px}
.sline{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;background:var(--card)}
.sline .rn{font-weight:700;font-size:15px}
.sline .rn small{font-weight:400;color:var(--sub);font-size:12.5px;margin-left:6px}
.sline .cnt{font-family:var(--display);font-size:16px;align-self:center}
.sline .cnt.full{color:var(--ok)}.sline .cnt.low{color:var(--alert)}
.meter{grid-column:1/-1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink)}
.meter.full i{background:var(--ok)}.meter.low i{background:var(--alert)}
.sline .why{grid-column:1/-1;font-size:12.5px;color:var(--alert);font-weight:700}
.sline .ok{grid-column:1/-1;font-size:12.5px;color:var(--sub)}
.addslot{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--card);padding:10px;font-size:14px;color:var(--sub)}
ul.salerts{list-style:none;margin:0 0 10px;padding:0;background:var(--card);border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.salert{padding:12px 14px;border-top:1px solid var(--line);box-shadow:inset 4px 0 0 var(--alert)}
.salert:first-child{border-top:0}
.salert.warn{box-shadow:inset 4px 0 0 var(--tape)}
.salert .top{display:flex;align-items:baseline;gap:8px}
.salert .top b{font-size:15px}.salert .top span{font-size:12.5px;color:var(--sub)}
.salert .top em{font-style:normal;font-family:var(--display);margin-left:auto;font-size:16px}
.salert .why{font-size:13px;font-weight:700;color:var(--alert);margin:6px 0 8px}
.salert.warn .why{color:var(--hl-muted)}
.salert .meter{margin-top:6px}
.salert .acts2{display:flex;gap:8px;flex-wrap:wrap}
.people{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:1fr 1fr 64px 56px 32px;gap:6px;align-items:center}
.prow input,.prow select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:8px;font-size:15px;min-width:0}
.prow .ph{grid-column:1/5}
.prow button{border:0;background:none;color:var(--faint);font-size:20px;padding:0}
.pnum{font-size:12px;color:var(--sub)}
.copyarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:12px;font-size:14px;line-height:1.6;font-family:var(--font)}
.minibtn{border:1px solid var(--alert);color:var(--alert);background:var(--card);border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:6px}
.phs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.phs button{border:1px dashed var(--faint);background:transparent;border-radius:8px;padding:2px 8px;font-size:12.5px;color:var(--sub)}
details.more{margin:0 0 14px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
details.more summary{font-size:14px;font-weight:700;cursor:pointer}
details.more[open] summary{margin-bottom:10px}
.pvlist{font-size:13.5px;background:var(--paper);border-radius:12px;padding:10px 12px;margin:10px 0}
.pvlist div{display:grid;grid-template-columns:88px 1fr;gap:8px;padding:3px 0;border-top:1px dashed var(--line)}
.pvlist div:first-child{border-top:0}
.pvlist b{color:var(--sub);font-weight:400}
.pvlist span{white-space:pre-wrap;word-break:break-word}
.money{grid-column:1/-1;font-size:12.5px;color:var(--sub)}
.money b{color:var(--ok)}.money b.neg{color:var(--alert)}
.payrow{padding:8px 0;border-top:1px dashed var(--line)}
.payrow:first-child{border-top:0}
.payrow .t{font-size:13.5px;margin-bottom:6px}
.payrow .seg button{padding:5px 10px;font-size:13px}
.toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(var(--nav) + 84px + env(safe-area-inset-bottom,0px));transform:translateY(16px);
  background:var(--ink);color:var(--paper);padding:10px 12px 10px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80;
  display:flex;gap:12px;align-items:center;max-width:92vw}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast button{border:0;background:var(--tape);color:var(--tape-ink);border-radius:9px;padding:5px 10px;font-weight:700;font-size:13px;white-space:nowrap}

/* =========================================================
   v0.8 デザイン：バックステージの操作卓。黒と白、細い罫線、
   タイムコードのような細長い数字。色は「意味があるときだけ」。
   ========================================================= */
:root{
  --paper:#F3F4F6; --card:#FFFFFF; --ink:#0E1116; --sub:#5F6673; --faint:#9CA2AD; --line:#DCDFE4; --soft:#ECEEF1;
  --sig:#E5A100; --sig-ink:#0E1116; --tape:#0E1116; --tape-ink:#FFFFFF;
  --alert:#D93A2B; --alert-bg:rgba(217,58,43,.10); --wait:#2F6DB5; --wait-bg:rgba(47,109,181,.10); --ok:#1F8A52; --ok-bg:rgba(31,138,82,.10);
  --shadow:none; --r:8px;
  --display:"Barlow Condensed","Arial Narrow","Hiragino Sans",sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0B0D11; --card:#14171D; --ink:#ECEEF1; --sub:#8C94A2; --faint:#5C6470; --line:#252A33; --soft:#1B1F26;
  --tape:#ECEEF1; --tape-ink:#0B0D11; --alert:#FF5A47; --alert-bg:rgba(255,90,71,.12); --wait:#6FA8F0; --wait-bg:rgba(111,168,240,.12); --ok:#3DC47E; --ok-bg:rgba(61,196,126,.12);
}}
:root[data-theme="dark"]{
  --paper:#0B0D11; --card:#14171D; --ink:#ECEEF1; --sub:#8C94A2; --faint:#5C6470; --line:#252A33; --soft:#1B1F26;
  --tape:#ECEEF1; --tape-ink:#0B0D11; --alert:#FF5A47; --alert-bg:rgba(255,90,71,.12); --wait:#6FA8F0; --wait-bg:rgba(111,168,240,.12); --ok:#3DC47E; --ok-bg:rgba(61,196,126,.12);
}
:focus-visible{outline:2px solid var(--sig)}
body{letter-spacing:.01em}
.hd{padding:20px 18px 8px}
.hd h1{font-size:26px;letter-spacing:.04em}
.hd .date{font-family:var(--display);font-size:15px;letter-spacing:.06em;color:var(--sub)}
.iconbtn{border-radius:var(--r);background:transparent}

/* 本番までのカウント：スレート（撮影のカチンコ）風 */
.tape{background:transparent;color:var(--ink);clip-path:none;padding:0 0 0 10px;border-left:3px solid var(--sig);gap:8px;align-items:baseline}
.tape .d{font-family:var(--display);font-weight:600;font-size:34px;letter-spacing:.02em;line-height:.95}
.tape .l{font-size:11.5px;color:var(--sub);font-weight:500;order:2}
.shows{gap:22px;padding:14px 0 6px}
.shows .nx em{padding-left:13px;font-size:12.5px}
.pcard .tape .d{font-size:30px}

.plan{border-radius:var(--r);border-color:var(--line)}
.plan b{font-family:var(--display);font-weight:600;font-size:36px;letter-spacing:.02em}
.plan span{font-size:12px}
.progress{height:2px}

.sec h2{font-size:13px;letter-spacing:.08em;color:var(--sub);font-weight:700}
.sec h2 small{font-family:var(--display);font-size:14px;letter-spacing:.04em}
.sec.alert h2{color:var(--alert)}
ul.tasks,ul.salerts,.pcard,.closeday,.tl-wrap,.slots,.kcard,.kcol{border-radius:var(--r);box-shadow:none}
.task .face{padding:14px 14px}
.task.issue .face,.kcard.issue{box-shadow:inset 3px 0 0 var(--alert)}
.check{border-width:1.5px;border-radius:50%}
.done .check{background:var(--ink);border-color:var(--ink)}.done .check svg{color:var(--paper)}
.meta span{border-radius:4px;background:transparent;border:1px solid var(--line);padding:0 6px}
.meta .proj{border-color:var(--line);color:var(--ink)}
.meta .today{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.meta .late{background:var(--alert-bg);border-color:transparent}
.meta .wt{background:var(--wait-bg);border-color:transparent}
.meta .cmp{border:1px dashed var(--sig);color:var(--sig)}
.iss{font-weight:500}

.btn{border-radius:var(--r);height:42px;border-color:var(--line);font-weight:700;letter-spacing:.02em}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.sm{height:34px}
.minibtn{border-radius:4px}
.seg button{border-radius:6px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.meter{height:4px;border-radius:0}
.meter i{background:var(--ink)}
.salert{box-shadow:inset 3px 0 0 var(--alert)}
.salert.warn{box-shadow:inset 3px 0 0 var(--sig)}
.salert .top em,.sline .cnt{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.02em}
.salert.warn .why{color:var(--sig)}
.slh{background:transparent;border-bottom:1px solid var(--line);font-size:13px;letter-spacing:.06em}
.slh .kind{border-radius:4px}
.sline{border-top:0;border-bottom:1px solid var(--line)}
.sline:last-of-type{border-bottom:0}

.tl .dh b{font-family:var(--display);font-size:16px;font-weight:600}
.tl .dh.td b{background:var(--ink);color:var(--paper);border-radius:4px}
.tl .cell.td{background:rgba(229,161,0,.10)}
.tl .dot{width:14px;height:14px;margin:-7px 0 0 -7px;font-size:9px;border-width:0;border-radius:50%}
.tl .dot[data-many]{width:20px;height:20px;margin:-10px 0 0 -10px;font-family:var(--display);font-size:12px}
.tl .span{height:2px;margin-top:-1px;background:var(--faint)}
.tl .show{background:transparent;color:var(--sig);clip-path:none;border-left:3px solid var(--sig);inset:10px auto 10px 50%;width:auto;padding-left:4px;font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.06em}

.kcol{background:transparent;border:1px solid var(--line)}
.kcol h3{font-size:12.5px;letter-spacing:.08em}
.kcol h3 span{font-family:var(--display);font-size:15px}
.kcol[data-st="inbox"] h3 i{background:var(--sig)}

.capbox{border-radius:12px;border:1.5px solid var(--ink);box-shadow:none;background:var(--card)}
.capbox button{border-radius:8px}
.pv button{background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:4px;font-weight:500}
.pv button.off{border-color:var(--line)}
.pv .boshu{background:var(--ink);color:var(--paper)}
.srcrow button{border-radius:4px}

nav.tabs{background:var(--card)}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:34%;right:34%;height:2px;background:var(--ink)}
nav.tabs .badge{border-radius:4px}
.sheet{border-radius:14px 14px 0 0}
.fld input,.fld select,.fld textarea,.copyarea,.search input{border-radius:6px}
.toast{border-radius:8px}
.toast button{background:var(--paper);color:var(--ink);border-radius:4px}
.chk{border-radius:6px}

/* 案件カードのアクションバー */
.pact{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.pact button{height:44px;border-radius:6px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.2}
.pact button.main{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pact button small{font-weight:400;font-size:10.5px;opacity:.7}
.lead{margin:14px 0 0;padding:12px 14px;border:1px dashed var(--line);border-radius:var(--r);font-size:13px;color:var(--sub)}
.lead b{color:var(--ink)}
.pv span.boshu{font-size:12.5px;padding:3px 8px;border-radius:4px;font-weight:700}

/* =========================================================
   v0.9 グラデーション：ステージの照明のように、
   「今どこを見るべきか」を光で示す。色は信号にだけ使う。
   ========================================================= */
:root{
  --g1:#1FD1F9; --g2:#3B6CFF; --g3:#9B5CFF;
  --grad:linear-gradient(100deg,var(--g1) 0%,var(--g2) 52%,var(--g3) 100%);
  --grad-v:linear-gradient(180deg,var(--g1),var(--g2) 55%,var(--g3));
  --grad-alert:linear-gradient(100deg,#FF7A45,#FF3D6E);
  --grad-ok:linear-gradient(100deg,#19D3A2,#1FD1F9);
  --grad-warn:linear-gradient(100deg,#FFC23D,#FF7A45);
  --sig:#3B6CFF;
}
body{background:
  radial-gradient(900px 420px at 110% -8%, rgba(59,108,255,.16), transparent 62%),
  radial-gradient(700px 360px at -20% 4%, rgba(155,92,255,.12), transparent 60%),
  var(--paper) no-repeat}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) body{background:
  radial-gradient(900px 460px at 110% -8%, rgba(59,108,255,.28), transparent 62%),
  radial-gradient(700px 380px at -20% 4%, rgba(155,92,255,.20), transparent 60%),
  var(--paper) no-repeat} }
:root[data-theme="dark"] body{background:radial-gradient(900px 460px at 110% -8%, rgba(59,108,255,.28), transparent 62%),radial-gradient(700px 380px at -20% 4%, rgba(155,92,255,.20), transparent 60%),var(--paper) no-repeat}
.gtext,.tape .d,.plan .t b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tape{border-left:0;position:relative;padding-left:12px}
.tape::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:3px;background:var(--grad-v);border-radius:2px}
.plan{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(120deg,rgba(31,209,249,.55),rgba(59,108,255,.35) 40%,var(--line) 70%) border-box;border:1px solid transparent}
.plan .bad b{background:var(--grad-alert);-webkit-background-clip:text;background-clip:text;color:transparent}
.plan .w b{color:var(--wait)}
.progress{background:var(--soft)}.progress i{background:var(--grad)}
.bar i{background:var(--grad)}
.meter i{background:var(--grad)}
.meter.full i{background:var(--grad-ok)}
.meter.low i{background:var(--grad-alert)}
.btn.primary,.pact button.main,.capbox button{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(59,108,255,.28)}
.seg button[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff}
.capbox{background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;border:1.5px solid transparent;box-shadow:0 10px 30px rgba(59,108,255,.18)}
nav.tabs button[aria-selected="true"]::before{background:var(--grad);height:3px;border-radius:0 0 3px 3px}
nav.tabs .badge{background:var(--grad-alert)}
.task.issue .face,.kcard.issue,.salert{box-shadow:none;position:relative}
.task.issue .face::before,.kcard.issue::before,.salert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad-alert)}
.kcard{position:relative;overflow:hidden}
.salert.warn::before{background:var(--grad-warn)}
.salert{position:relative}
.meta .today{background:var(--grad);color:#fff;border-color:transparent}
.tl .dh.td b{background:var(--grad);color:#fff}
.tl .cell.td{background:linear-gradient(180deg,rgba(31,209,249,.10),rgba(155,92,255,.08))}
.tl .dot{background:var(--g2)}
.tl .dot.wait{background:var(--wait)}.tl .dot.late{background:#FF4D5E}.tl .dot.done{background:#19C39A}
.tl .show{border-left:0;color:transparent;background:var(--grad);-webkit-background-clip:text;background-clip:text}
.tl .show::before{content:"";position:absolute;left:-2px;top:0;bottom:0;width:3px;background:var(--grad-v)}
.pv button{border-color:var(--g2)}
.pv span.boshu{background:var(--grad);color:#fff}
.toast button{background:var(--grad);color:#fff}
.kcol[data-st="inbox"] h3 i{background:var(--grad)}
.kcol[data-st="doing"] h3 i{background:var(--g2)}
.pcard{position:relative;overflow:hidden}
.pcard::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;background:radial-gradient(closest-side,rgba(59,108,255,.14),transparent);pointer-events:none}
.check:hover{border-color:var(--g2)}
.done .check{background:var(--grad-ok);border-color:transparent}.done .check svg{color:#fff}
.sheet .grab{background:var(--grad);opacity:.7}
.lead{border-image:none;border:1px dashed rgba(59,108,255,.45)}
.nx em{color:var(--sub)}
@media (prefers-reduced-motion:no-preference){
  .btn.primary,.pact button.main,.capbox button{background-size:160% 100%;background-position:0 0;transition:background-position .4s ease}
  .btn.primary:active,.pact button.main:active,.capbox button:active{background-position:100% 0}
}

/* =========================================================
   v1.0 会社カラー：地の色（黒／白）→ 会社カラー（緑と青の間）→ ハイライト2色。
   会社カラーは主役の操作と進み具合に、アンバーは「時間」の合図、コーラルは「危険」だけに使う。
   ========================================================= */
:root{
  --brand:#0FB5A6;
  --brand-hi:#3FE0C5; --brand-lo:#0A8FA3;
  --brand-hi:color-mix(in oklab,var(--brand) 65%,#7CFFE0);
  --brand-lo:color-mix(in oklab,var(--brand) 72%,#1C63D6);
  --hl-amber:#FFB547; --hl-coral:#FF5C6A;
  --g1:var(--brand-hi); --g2:var(--brand); --g3:var(--brand-lo);
  --grad:linear-gradient(100deg,var(--brand-hi) 0%,var(--brand) 50%,var(--brand-lo) 100%);
  --grad-v:linear-gradient(180deg,var(--brand-hi),var(--brand) 55%,var(--brand-lo));
  --grad-ok:var(--grad);
  --grad-alert:linear-gradient(100deg,#FF8A5B,var(--hl-coral));
  --grad-warn:linear-gradient(100deg,#FFD166,var(--hl-amber));
  --grad-time:linear-gradient(100deg,#FFD166,var(--hl-amber));
  --sig:var(--hl-amber); --alert:#E5484D; --ok:var(--brand);
  --wait:#4F8FD6; --wait:color-mix(in oklab,var(--brand-lo) 70%,#5B7CFF);
  --wait-bg:rgba(79,143,214,.12);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --alert:var(--hl-coral); } }
:root[data-theme="dark"]{ --alert:var(--hl-coral); }
:root[data-theme="dark"]{ --paper:#0B0D11; --card:#14171D; --ink:#ECEEF1; --sub:#8C94A2; --faint:#5C6470; --line:#252A33; --soft:#1B1F26; }
:root[data-theme="light"]{ --paper:#F3F4F6; --card:#FFFFFF; --ink:#0E1116; --sub:#5F6673; --faint:#9CA2AD; --line:#DCDFE4; --soft:#ECEEF1; }
body{background:
  radial-gradient(900px 420px at 110% -8%, color-mix(in oklab,var(--brand) 22%,transparent), transparent 62%),
  radial-gradient(700px 360px at -20% 4%, color-mix(in oklab,var(--brand-lo) 14%,transparent), transparent 60%),
  var(--paper) no-repeat}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) body{background:
  radial-gradient(900px 460px at 110% -8%, color-mix(in oklab,var(--brand) 30%,transparent), transparent 62%),
  radial-gradient(700px 380px at -20% 4%, color-mix(in oklab,var(--brand-lo) 22%,transparent), transparent 60%),
  var(--paper) no-repeat} }
:root[data-theme="dark"] body{background:
  radial-gradient(900px 460px at 110% -8%, color-mix(in oklab,var(--brand) 30%,transparent), transparent 62%),
  radial-gradient(700px 380px at -20% 4%, color-mix(in oklab,var(--brand-lo) 22%,transparent), transparent 60%),
  var(--paper) no-repeat}
:root[data-theme="light"] body{background:
  radial-gradient(900px 420px at 110% -8%, color-mix(in oklab,var(--brand) 22%,transparent), transparent 62%),
  radial-gradient(700px 360px at -20% 4%, color-mix(in oklab,var(--brand-lo) 14%,transparent), transparent 60%),
  var(--paper) no-repeat}
.btn.primary,.pact button.main,.capbox button{box-shadow:0 6px 18px color-mix(in oklab,var(--brand) 35%,transparent)}
.capbox{box-shadow:0 10px 30px color-mix(in oklab,var(--brand) 22%,transparent)}
.plan{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(120deg,color-mix(in oklab,var(--brand-hi) 70%,transparent),color-mix(in oklab,var(--brand) 40%,transparent) 40%,var(--line) 70%) border-box}
.plan .w b{color:var(--wait)}
/* 時間の合図（本番・今日）はアンバー */
.tape::before{background:var(--grad-time)}
.tape .d{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.meta .today{background:var(--grad-time);color:#1A1204}
.tl .show{background:var(--grad-time);-webkit-background-clip:text;background-clip:text}
.tl .show::before{background:var(--grad-time)}
.tl .dh.td b{background:var(--grad-time);color:#1A1204}
.tl .cell.td{background:color-mix(in oklab,var(--hl-amber) 10%,transparent)}
.tl .dot{background:var(--brand)}.tl .dot.done{background:var(--faint)}.tl .dot.late{background:var(--hl-coral)}
.salert.warn::before{background:var(--grad-warn)}.salert.warn .why{color:#C98100}
.meta .cmp{border-color:var(--hl-amber);color:#C98100}
.pcard::after{background:radial-gradient(closest-side,color-mix(in oklab,var(--brand) 16%,transparent),transparent)}
.lead{border-color:color-mix(in oklab,var(--brand) 50%,transparent)}
.pv button{border-color:var(--brand)}
.done .check{background:var(--brand)}
.swatches{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.swatches button{width:40px;height:40px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.swpick{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);cursor:pointer}
.swpick input{width:40px;height:40px;border:0;padding:0;background:none;border-radius:50%}

/* =========================================================
   v1.1 寒色＋中間色で統一：暖色（黄・赤）をやめる。
   会社カラー（ティール）／時間の合図＝ペリウィンクル／危険＝モーヴ／待ち＝スチールブルー
   ========================================================= */
:root{
  --hl-time:#7F8BF0; --hl-time-hi:#A9B2FF;
  --hl-danger:#B8558A; --hl-danger-hi:#D77BB0; --hl-danger-lo:#8E5BC4;
  --hl-steel:#5E7FA8; --hl-muted:#8A87B0;
  --alert:var(--hl-danger); --alert-bg:rgba(184,85,138,.10);
  --wait:var(--hl-steel); --wait-bg:rgba(94,127,168,.12);
  --sig:var(--hl-time);
  --grad-time:linear-gradient(100deg,var(--hl-time-hi),var(--hl-time));
  --grad-alert:linear-gradient(100deg,var(--hl-danger-hi),var(--hl-danger) 55%,var(--hl-danger-lo));
  --grad-warn:linear-gradient(100deg,#B7B3DA,var(--hl-muted));
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --hl-danger:#E07FB3; --hl-danger-hi:#F2A2CB; --hl-danger-lo:#A884F0; --hl-steel:#8FB0D9; --hl-time:#9AA5FF; --hl-muted:#A7A3CF;
  --alert:var(--hl-danger); --alert-bg:rgba(224,127,179,.13); --wait:var(--hl-steel); --wait-bg:rgba(143,176,217,.13); } }
:root[data-theme="dark"]{
  --hl-danger:#E07FB3; --hl-danger-hi:#F2A2CB; --hl-danger-lo:#A884F0; --hl-steel:#8FB0D9; --hl-time:#9AA5FF; --hl-muted:#A7A3CF;
  --alert:var(--hl-danger); --alert-bg:rgba(224,127,179,.13); --wait:var(--hl-steel); --wait-bg:rgba(143,176,217,.13); }
.meta .today{background:var(--grad-time);color:#fff;border-color:transparent}

/* =========================================================
   v1.2 配色（調べた原則にもとづいて組み直し）

   2) 類似色（アナロガス）：ティール → ブルー → パープル の隣り合う3色だけ
   3) OKLCHで3色の明るさ・鮮やかさをそろえる（同じ「重さ」に見える）
   4) ニュートラルはブルー寄りにわずかに色味をつけて一体感を出す
   5) ダークでは明るく・彩度控えめに、ライトでは濃くして読みやすさを確保
   役割：ティール＝会社・操作・完了／ブルー＝時間・情報・返事待ち／パープル＝要対応（強調）
   ========================================================= */
:root, :root[data-theme="light"]{

}

  --paper:#0A0E12; --card:#13181E; --soft:#1A2027; --line:#242931; --ink:#E4E8ED; --sub:#979FAA; --faint:#5F6874;
  --teal:#58D1C5; --teal-hi:#6DE5D8; --teal-lo:#40BEB2;
  --blue:#86BFFF; --blue-hi:#98D3FF; --blue-lo:#73ACEB;
  --purple:#B794FC; --purple-hi:#CAA7FF; --purple-lo:#A481E8;
  --on-accent:#0A0E12;
}}

  --paper:#0A0E12; --card:#13181E; --soft:#1A2027; --line:#242931; --ink:#E4E8ED; --sub:#979FAA; --faint:#5F6874;
  --teal:#58D1C5; --teal-hi:#6DE5D8; --teal-lo:#40BEB2;
  --blue:#86BFFF; --blue-hi:#98D3FF; --blue-lo:#73ACEB;
  --purple:#B794FC; --purple-hi:#CAA7FF; --purple-lo:#A481E8;
  --on-accent:#0A0E12;
}
:root{
  --brand:var(--teal);
  --grad:linear-gradient(100deg,var(--teal-hi),var(--teal) 45%,var(--blue));
  --grad-v:linear-gradient(180deg,var(--teal-hi),var(--blue));

}

  radial-gradient(800px 380px at 105% -6%, color-mix(in oklab,var(--teal) 12%,transparent), transparent 60%),
  radial-gradient(600px 320px at -15% 2%, color-mix(in oklab,var(--blue) 9%,transparent), transparent 60%), var(--paper)!important} }

  radial-gradient(800px 380px at 105% -6%, color-mix(in oklab,var(--teal) 12%,transparent), transparent 60%),

/* 操作（ティール） */

/* 要対応・強調（パープル＝アーチの端、いちばん鮮やか） */
.sec.alert h2,.iss,.salert .why,.sline .why,.sline .cnt.low,.money b.neg{color:var(--purple)}

/* =========================================================
   v1.3 会社カラー #0B6667 を基準に再計算（OKLCH：明るさ0.46／鮮やかさ0.076／色相196°）
   ・ティールは会社カラーの明暗違いで展開（ふだんの使い方に合わせる）
   ・ブルー（250°）とパープル（295°）は会社カラーと同じ明るさ・近い鮮やかさで作る
   ・パープルだけ少し鮮やかにして「要対応」の強調に使う
   ・地のグレーは会社カラーの色相に寄せる
   ========================================================= */
:root, :root[data-theme="light"]{
  --paper:#F3F8F8; --card:#FFFFFF; --soft:#E8EEEE; --line:#D8E0E0; --ink:#101D1D; --sub:#596666; --faint:#96A1A1;
  --teal:#0B6667; --teal-hi:#338283; --teal-lo:#094C4D;
  --blue:#386695; --blue-hi:#4F78A2; --blue-lo:#1D456B;
  --purple:#6A51A4; --purple-hi:#8068BC; --purple-lo:#553C8C;
  --on-accent:#FFFFFF;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#060E0E; --card:#0D1717; --soft:#141E1E; --line:#1D2929; --ink:#E3E9E9; --sub:#98A4A4; --faint:#606C6B;
  --teal:#74C1C1; --teal-hi:#94E1E1; --teal-lo:#54A1A1;
  --blue:#88B6E6; --blue-hi:#AFD5FE; --blue-lo:#6C96C2;

  --on-accent:#061010;
}}
:root[data-theme="dark"]{
  --paper:#060E0E; --card:#0D1717; --soft:#141E1E; --line:#1D2929; --ink:#E3E9E9; --sub:#98A4A4; --faint:#606C6B;
  --teal:#74C1C1; --teal-hi:#94E1E1; --teal-lo:#54A1A1;
  --blue:#88B6E6; --blue-hi:#AFD5FE; --blue-lo:#6C96C2;
  --purple:#B09BEE; --purple-hi:#C9B8FF; --purple-lo:#9784D6;
  --on-accent:#061010;
}
:root{
  --grad:linear-gradient(100deg,var(--teal-lo) 0%,var(--teal) 40%,var(--teal-hi) 75%,var(--blue-hi) 100%);
  --grad-v:linear-gradient(180deg,var(--teal-hi),var(--teal-lo));

/* 主役のボタンは、ダークでもライトでも「会社カラーそのもの」（#0B6667）の明暗で塗る */

/* =========================================================
   v1.4 会社カラーのグラデーションを、会社カラーを使う場所すべてに。
   #0B6667 の「深い側」から「明るく少し青寄りの側」へ斜めに流し、
   上側にうっすら光を足して立体感（最先端感）を出す。
   ========================================================= */
:root{
  --brand-grad:linear-gradient(125deg,#07494A 0%,#0B6667 38%,#17807F 72%,#2B8C9E 100%);

.progress i,.bar i,.meter i,.meter.full i{background:var(--brand-grad)}
.kcol[data-st="inbox"] h3 i,.kcol[data-st="doing"] h3 i{background:var(--brand-grad)}
.tl .dot{background:var(--brand-grad)}
.tl .dot.wait{background:var(--grad-time)}.tl .dot.late{background:var(--grad-alert)}.tl .dot.done{background:var(--faint)}
.mods span{border-color:transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--brand-grad) border-box;border:1px solid transparent}
.lead{border:1px dashed #2B8C9E}
/* ダークでは同じ流れを明るい側で。文字の数字は明るい会社カラーで */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --brand-grad-light:linear-gradient(125deg,#4FA3A3 0%,#74C1C1 45%,#94E1E1 75%,#9CCBEA 100%);

  :root:not([data-theme="light"]) .progress i,:root:not([data-theme="light"]) .bar i,:root:not([data-theme="light"]) .meter i,:root:not([data-theme="light"]) .meter.full i,

@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --alert:var(--purple); --alert-bg:color-mix(in oklab,var(--purple) 14%,transparent); --hl-danger:var(--purple); --wait:var(--blue); --wait-bg:color-mix(in oklab,var(--blue) 14%,transparent); --hl-steel:var(--blue); --hl-muted:var(--blue); --hl-time:var(--blue); --ok:var(--teal); --sig:var(--blue); } }
:root[data-theme="dark"]{ --alert:var(--purple); --alert-bg:color-mix(in oklab,var(--purple) 14%,transparent); --hl-danger:var(--purple); --wait:var(--blue); --wait-bg:color-mix(in oklab,var(--blue) 14%,transparent); --hl-steel:var(--blue); --hl-muted:var(--blue); --hl-time:var(--blue); --ok:var(--teal); --sig:var(--blue); }
:root[data-theme="light"]{ --alert:var(--purple); --alert-bg:color-mix(in oklab,var(--purple) 14%,transparent); --hl-danger:var(--purple); --wait:var(--blue); --wait-bg:color-mix(in oklab,var(--blue) 14%,transparent); --hl-steel:var(--blue); --hl-muted:var(--blue); --hl-time:var(--blue); --ok:var(--teal); --sig:var(--blue); }

/* =========================================================
   v1.5 至急：会社カラー（ティール 196°）のちょうど反対側＝赤（補色）。
   補色は画面の中で一番目立つので、これだけに使う。赤→オレンジのグラデーション。
   OKLCHで明るさを他の色とそろえ、ライトは深め、ダークは明るめのコーラルに。
   ========================================================= */
:root,:root[data-theme="light"]{ --fatal:#D33A3C; --fatal-2:#E36927; --fatal-bg:rgba(211,58,60,.08); --on-fatal:#FFFFFF; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --fatal:#F97770; --fatal-2:#FBA962; --fatal-bg:rgba(249,119,112,.10); --on-fatal:#1A0A08; } }

/* お金 */

.selfbox{margin-top:12px}
.pcard.flash{box-shadow:0 0 0 3px var(--blue);transition:box-shadow .3s}

.nx[data-pid]{cursor:pointer}

/* ガント */
.tl .dh{min-height:74px}
.tl .dh .cnts{display:flex;flex-direction:column;align-items:center;gap:1px;margin-top:2px;min-height:26px}
.tl .dh .cnts i{font-style:normal;font-size:9.5px;font-weight:700;line-height:1.2;padding:0 3px;border-radius:3px}
.tl .dh .cd{color:#fff;background:var(--teal-lo,#2e8c8c)}.tl .dh .cr{color:var(--blue);border:1px solid color-mix(in oklab,var(--blue) 60%,transparent)}
.tl .corner{flex-direction:column;justify-content:flex-end;gap:6px;padding:6px 6px 8px}
.tlmode{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.tlmode button{flex:1;height:26px;border:0;background:transparent;color:var(--sub);font-size:12px;font-weight:700;padding:0 8px;cursor:pointer;white-space:nowrap}
.tlmode button[aria-pressed="true"]{background:var(--btn);color:#fff}
.tl .cell{position:relative;min-height:44px}
.gbar{position:absolute;top:calc(50% - 11px);left:3px;height:22px;margin-top:0;border-radius:6px;z-index:1;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;cursor:pointer;box-sizing:border-box}
.gbar span{overflow:hidden;text-overflow:ellipsis}
.gbar.g-prep{background:color-mix(in oklab,var(--teal) 22%,transparent);border:1px dashed color-mix(in oklab,var(--teal) 70%,transparent);color:var(--ink)}
.gbar.g-show{background:var(--grad);color:var(--on-accent,#fff)}
.gbar.g-bill{background:color-mix(in oklab,var(--purple) 22%,transparent);border:1px solid var(--purple);color:var(--purple)}
.gbar.g-bill.g-done{background:color-mix(in oklab,var(--faint) 25%,transparent);border-color:var(--faint);color:var(--sub)}
.gbar.g-tk{background:color-mix(in oklab,var(--teal) 28%,transparent);border:1px solid var(--teal);color:var(--ink)}
.gbar.g-tk.g-doing{background:var(--grad);color:var(--on-accent,#fff);border-color:transparent}
.gbar.g-tk.g-wait{background:color-mix(in oklab,var(--blue) 25%,transparent);border-color:var(--blue)}
.gbar.g-tk.g-late{background:color-mix(in oklab,var(--purple) 25%,transparent);border-color:var(--purple);color:var(--purple)}
.gbar.g-tk.g-fatal{background:var(--grad-fatal);border-color:transparent;color:var(--on-fatal)}
.gbar.g-tk.g-nodue{background-image:linear-gradient(90deg,transparent,transparent 70%,var(--card));border-style:dashed}
.tl .lab .labbtn{all:unset;cursor:pointer;display:block;width:100%;font-weight:700;font-size:12.5px;line-height:1.3;overflow:hidden}
.tl .lab .labbtn small{display:block;font-weight:500;font-size:11px;color:var(--sub);white-space:nowrap}
.legend .lg{display:inline-block;width:18px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.lg.prep{border:1px dashed var(--teal);background:color-mix(in oklab,var(--teal) 22%,transparent)}.lg.show{background:var(--grad)}.lg.bill{border:1px solid var(--purple);background:color-mix(in oklab,var(--purple) 22%,transparent)}.lg.billd{background:color-mix(in oklab,var(--faint) 30%,transparent)}
.lg.tk{border:1px solid var(--teal);background:color-mix(in oklab,var(--teal) 28%,transparent)}.lg.doing{background:var(--grad)}.lg.wait{border:1px solid var(--blue);background:color-mix(in oklab,var(--blue) 25%,transparent)}.lg.late{border:1px solid var(--purple)}.lg.fatal{background:var(--grad-fatal)}
.tlbar{margin:10px 0}
.tlbar .tlmode{display:inline-flex;max-width:100%}
.tlbar .tlmode button{height:34px;padding:0 16px;font-size:13px}
.gzen{position:absolute;top:calc(50% - 12px);left:2px;right:2px;height:24px;border-radius:6px;border:1px solid var(--blue);background:color-mix(in oklab,var(--blue) 22%,var(--card));color:var(--blue);font-size:10px;font-weight:700;z-index:2;cursor:pointer;padding:0;white-space:nowrap;overflow:hidden}
.gzen.done{border-color:var(--faint);color:var(--sub);background:var(--card)}.gzen.late{border-color:var(--fatal);color:var(--fatal)}
.lg.zen{border:1px solid var(--blue);background:color-mix(in oklab,var(--blue) 22%,transparent)}
.tl{--labw:96px}
@media (min-width:1024px){ .tl{--labw:190px} }
.gbar{overflow:clip}
.gbar span{position:sticky;left:calc(var(--labw) + 6px)}
.sync{cursor:pointer}
.mlist .mrow .mr .chip+.chip{margin-top:2px}
optgroup{font-weight:700;color:var(--sub)}

.pmgap{display:block;width:100%;text-align:left;margin-top:10px;padding:8px 12px;border:1px dashed var(--purple);border-radius:var(--r);background:color-mix(in oklab,var(--purple) 8%,transparent);color:var(--ink);font-size:12.5px;cursor:pointer}
.pmgap b{color:var(--purple)}

/* 手配とお金の画面 */
.hmsum{position:sticky;top:-22px;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden;margin-bottom:12px;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.hmsum div{padding:8px 10px;border-left:1px solid var(--line);display:flex;flex-direction:column}.hmsum div:first-child{border-left:0}
.hmsum span{font-size:11px;color:var(--sub)}.hmsum b{font-family:var(--display);font-size:20px;font-weight:600;white-space:nowrap}.hmsum small{font-size:11px;color:var(--sub)}
.hmsum .g b{color:var(--teal)}
.hmtop{display:grid;grid-template-columns:1fr 90px;gap:8px 10px;margin-bottom:6px}
.hmtop .wide{grid-column:1/-1}
.payone{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.hmsec{margin-top:14px}
.hmh{font-weight:700;font-size:13.5px;margin-bottom:6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.hmh small{font-weight:400;color:var(--sub);font-size:11.5px}
.hmrow{display:grid;gap:6px 8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px;
  grid-template-columns:repeat(6,minmax(0,1fr)) 36px;
  grid-template-areas:"role role role vend vend vend x" "sess sess sess sess sess sess sess" "need need days days unit unit unit" "hrs hrs hrs . . . ." "sell sell sell price price price price" "pname pname pname g g g g"}
.hmrow.me{grid-template-areas:"role role role vend vend vend x" "days days sell sell sell sell sell" "g g g g g g g"}
.hmrow.ex{grid-template-areas:"role role role vend vend vend x" "sell sell sell price price price price" "g g g g g g g"}
.hmrow .role{grid-area:role}.hmrow .vend{grid-area:vend}.hmrow .hmx{grid-area:x}.hmrow .a-need{grid-area:need}.hmrow .a-days{grid-area:days}
.hmrow .hmu{grid-area:unit;margin:0;align-self:end;display:flex;flex-wrap:nowrap;gap:4px}.hmrow .hmu button{height:40px;flex:1;min-width:0;padding:0 6px}.hmrow .hrs{grid-area:hrs}
.hmrow .a-sess{grid-area:sess}.hmrow .a-sell{grid-area:sell}.hmrow .a-price{grid-area:price}.hmrow .hmp{grid-area:pname}.hmrow .hmg{grid-area:g;align-self:center}
.hmc{display:flex;flex-direction:column;font-size:11px;color:var(--sub);gap:3px;min-width:0}
.hmc[hidden]{display:none!important}
.hmn::-webkit-outer-spin-button,.hmn::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.hmn{-moz-appearance:textfield}
.hmc input,.hmc select,.hmt{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:0 10px;font-size:16px;min-width:0;width:100%;box-sizing:border-box}
.hmn{font-family:var(--display);font-weight:600;text-align:right}
.hmn.miss{border-color:var(--purple);background:color-mix(in oklab,var(--purple) 8%,var(--paper))}
.hmg{font-size:12.5px;font-weight:700;color:var(--teal);text-align:right}.hmg.neg{color:var(--fatal)}
.hmp{height:34px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font-size:12.5px;font-weight:700;padding:0 10px;cursor:pointer}
.hmp.ok{border-color:var(--teal);color:var(--teal)}
.hmx{width:36px;height:40px;border:0;background:transparent;color:var(--sub);font-size:20px;cursor:pointer}
@media (min-width:1024px){
  .hmrow{grid-template-columns:minmax(130px,1.6fr) minmax(100px,1.2fr) 58px 58px 116px 70px 96px 96px minmax(104px,1fr) 80px 32px;grid-template-areas:"role vend need days unit hrs sell price g pname x" "sess sess sess sess sess sess sess sess sess sess sess"}
  .hmtop{grid-template-columns:1fr 110px 200px 200px}.hmtop .wide{grid-column:auto}
  .hmrow.me{grid-template-columns:minmax(130px,1.6fr) minmax(160px,2fr) 58px 150px minmax(104px,1fr) 32px;grid-template-areas:"role vend days sell g x"}
  .hmrow.ex{grid-template-columns:minmax(160px,2fr) minmax(100px,1.2fr) 120px 120px minmax(104px,1fr) 32px;grid-template-areas:"role vend sell price g x"}
  .hmrow .hrs[hidden]{display:flex!important;visibility:hidden}
  .sheet.wide{width:min(1080px,calc(100vw - var(--side) - 24px))!important}
  .hmrow{gap:6px}
}

.tmore{list-style:none}.tmore button{width:100%;min-height:40px;border:0;border-top:1px dashed var(--line);background:transparent;color:var(--teal);font-weight:700;font-size:13px;cursor:pointer}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.mtbl{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.mtbl th,.mtbl td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-family:var(--display)}
.mtbl th:first-child,.mtbl td:first-child{text-align:left;font-family:inherit}
.mtbl th{font-size:11.5px;color:var(--sub);font-weight:700;background:var(--soft)}
.mtbl tr.fut td{color:var(--sub)}.mtbl td small{margin-left:4px;font-size:10px;color:var(--blue)}
.mtbl td.neg{color:var(--fatal)}.mtbl tfoot td{font-weight:700;border-bottom:0;background:var(--soft)}
.mtax{margin:10px 0}

/* カレンダー */
.calv{border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.calvh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.calvh b{flex:1;text-align:center;font-family:var(--display);font-size:19px}
.calvh>button:not(.btn){width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:20px;cursor:pointer}
.calvg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.calvg>i{font-style:normal;font-size:11px;text-align:center;color:var(--sub);padding:6px 0;border-bottom:1px solid var(--line)}
.calvg>i.sun{color:var(--fatal)}.calvg>i.sat{color:var(--blue)}
.cd{position:relative;min-height:74px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:4px 3px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.cd:nth-child(7n+7){border-right:0}
.cd .dn{font-family:var(--display);font-weight:600;font-size:13px;padding-left:2px}
.cd.sun .dn{color:var(--fatal)}.cd.sat .dn{color:var(--blue)}.cd.out{opacity:.4}
.cd.td .dn{display:inline-block;background:var(--blue);color:#fff;border-radius:6px;padding:0 5px;width:max-content}
.cd.sel{background:color-mix(in oklab,var(--teal) 14%,transparent);box-shadow:inset 0 0 0 2px var(--teal)}
.cp{display:block;font-size:10px;line-height:1.35;font-weight:700;padding:1px 4px;border-radius:4px;background:color-mix(in oklab,var(--teal) 30%,transparent);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp:not(.st){border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-3px}.cp:not(.en){border-top-right-radius:0;border-bottom-right-radius:0;margin-right:-3px}
.cp.end{background:color-mix(in oklab,var(--faint) 30%,transparent);color:var(--sub)}
.cmore{font-size:10px;color:var(--sub);padding-left:3px}
.cl{display:block;height:13px;font-size:9px;line-height:13px;font-weight:700;color:var(--blue);padding:0 3px;background:color-mix(in oklab,var(--blue) 16%,transparent);border-top:2px solid color-mix(in oklab,var(--blue) 70%,transparent);white-space:nowrap;overflow:visible;margin:0 -3px;position:relative;z-index:1}
.cl.st{margin-left:0;border-top-left-radius:3px}.cl.en{margin-right:0;border-top-right-radius:3px}.cl.end{color:var(--sub);border-top-color:var(--faint);background:color-mix(in oklab,var(--faint) 16%,transparent)}
.cdots{position:absolute;left:4px;right:4px;bottom:3px;display:flex;gap:4px;align-items:center}
.cdots .z{width:7px;height:7px;border-radius:50%;background:var(--blue)}
.cdots .k{font-style:normal;font-size:9.5px;font-weight:700;color:var(--purple);margin-left:auto}
.calday{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:12px;scroll-margin-top:12px}
.caldh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.caldh b{font-size:16px}.caldh small{margin-left:6px;color:var(--fatal);font-size:11px}.caldh div{display:flex;gap:6px}
.calsec{margin-top:8px}.calsec .lb{display:block;font-size:11.5px;color:var(--sub);margin-bottom:4px}
.calrow{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:8px;background:transparent;color:var(--ink);padding:8px 10px;margin-bottom:6px;cursor:pointer}
.calrow.z{border-left-color:var(--blue)}.calrow b{display:block;font-size:13.5px}.calrow span{font-size:12px;color:var(--sub)}
@media (min-width:1024px){ .cd{min-height:104px}.cp{font-size:11.5px}.calwrapx{} }
.cashbd{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:10px 12px;margin:10px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px}
.cashbd>span{grid-column:1/-1;font-size:12px;color:var(--sub)}.cashbd div{display:flex;flex-direction:column}.cashbd i{font-style:normal;font-size:11px;color:var(--sub)}.cashbd b{font-family:var(--display);font-size:16px}

.sessbox .tbd,.calrow .tbd{color:var(--purple)}.cp.tbd{background:color-mix(in oklab,var(--purple) 22%,transparent)}
.gbar.g-show.g-tbd{background:color-mix(in oklab,var(--purple) 35%,transparent);color:var(--ink)}
.sessbox .addslot{flex:1}
.calrow .sessl{font-size:12px;color:var(--teal)}
.dtl{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
.dth{position:absolute;left:0;right:0;border-top:1px solid var(--line);height:44px}.dth span{position:absolute;left:6px;top:2px;font-size:10.5px;color:var(--sub);font-family:var(--display)}
.dti{position:absolute;border:0;border-radius:6px;padding:3px 6px;font-size:11.5px;text-align:left;overflow:hidden;cursor:pointer;color:var(--ink);line-height:1.3}
.dti.tk{background:color-mix(in oklab,var(--blue) 30%,var(--card));border-left:3px solid var(--blue)}
.dti.pj{background:color-mix(in oklab,var(--teal) 25%,var(--card));border-left:3px solid var(--teal)}
.dti b{font-family:var(--display)}
</style>
</head>
<body>

<header class="hd">
  <div><div class="wordmark" aria-label="Lv.OPS"><svg class="lvword" viewBox="0 0 524 110" aria-label="Lv.OPS" role="img"><path d="M12 10 V92 H66" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="square"/><path d="M88 40 L123.0 100 L158 40 L130.5 40 L123.0 64.8 L115.5 40 Z" fill="currentColor"/><circle class="lvdot" cx="172" cy="91" r="11"/><g fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="butt" stroke-linejoin="miter" class="lvops"><path d="M216 10 H261.73333333333335 L281.73333333333335 30 V80 L261.73333333333335 100 H216 L196 80 V30 Z"/><path d="M312.1333333333333 100 V10 H372.2933333333333 L389.2933333333333 27.0 V45.199999999999996 L372.2933333333333 62.199999999999996 H312.1333333333333"/><path d="M514.0 10 H445.26666666666665 L428.26666666666665 27.0 V38.0 L445.26666666666665 55.0 H497.0 L514.0 72.0 V83.0 L497.0 100 H428.26666666666665"/></g></svg></div><h1 id="hTitle">今日</h1><div class="date" id="hDate"></div><div class="sync" id="syncSt" data-act="syncNow" tabindex="0"></div></div>
  <div style="display:flex;gap:8px"><button class="iconbtn" id="setBtn" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <button class="iconbtn" id="searchBtn" aria-label="タスクを検索"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button></div>
</header>

<main>
  <section class="view on" id="v-today">
    <div class="shows" id="shows"></div>
    <div class="plan" id="plan"></div>
    <div id="todayBody"></div>
  </section>
  <section class="view" id="v-time">
    <div class="tlbar" id="tlBar"></div>
    <div id="calView"></div>
    <div class="tl-wrap" id="tlWrap"><div class="tl" id="tl"></div></div>
    <div class="legend" id="tlLegend"></div>
    <p class="hint">上のボタンで「カレンダー」「案件のガント」「タスクのガント」を切り替えられます。日付の下の「期」はその日が期日のタスク、「進」はその日に進行中（始める日〜期日のあいだ）のタスクの数です。棒を押すと、案件やタスクを開けます。</p>
  </section>
  <section class="view" id="v-board">
    <div class="bfilter"><select id="boardProj" aria-label="案件で絞り込み"></select></div>
    <div class="board" id="board"></div>
    <p class="hint">カード左の「⠿」をつまんで、別の列へドラッグできます。</p>
  </section>
  <section class="view" id="v-money"><div id="moneyBody"></div></section>
  <section class="view" id="v-proj">
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="addProj">案件を追加</button><button class="btn" id="pasteProj">募集文を貼って作る</button><button class="btn" data-act="library">資料庫</button><button class="btn" data-act="partners">取引先</button></div>
    <p class="lead"><b>元請けから募集文が来たら</b>、下の入力欄か「募集文を貼って作る」にそのまま貼るだけで案件ができます。<b>手配先に送る募集文</b>は、各案件の「募集文を作る」から。</p>
    <div id="projList"></div>
    <div class="foot">この試作のデータは、この端末のブラウザの中にだけ保存されます。<br><button id="resetBtn">サンプルデータに戻す</button></div>
  </section>
</main>

<div class="dock" id="dock"><div class="dock-in">
  <div class="pv" id="pv" aria-live="polite"></div>
  <form class="capbox" id="capForm" autocomplete="off">
    <textarea id="capIn" rows="1" enterkeyhint="send" placeholder="思いついたら1行で入れる" aria-label="タスクを入力"></textarea>
    <button type="submit">入れる</button>
  </form>

/* ---------- 表示する案件の決め方 ----------
 * ・今月中に終わる（終わった）案件は、月末まで表示
 * ・先月に終わった案件は、月初の数日（設定で変更・初期5日）は表示
 * ・さらに、請求がまだの案件は、請求書を送るまで表示し続ける（出し忘れ防止）
 */
function projEnd(p){ if(hasSess(p)) return p.sessions.map(sessEnd).sort().slice(-1)[0]; if(p.endDate) return p.endDate; const s0=fromIso(p.showDate); const m=(p.dateText||'').match(/〜\s*(\d{1,2})\/(\d{1,2})/);
  if(!m) return p.showDate; let y=s0.getFullYear(); if(+m[1]<s0.getMonth()+1) y++; return iso(new Date(y,+m[1]-1,+m[2])); }
function graceDays(){ const g=(S.settings||{}).graceDays; return g===undefined||g===null||g===''?5:+g; }
function hasBill(p){ return !!(projMoney(p).sale&&clientOf(p)); }
function billPending(p){ const m=projMoney(p); if(!m.sale) return false; const c=clientOf(p); if(!c) return false;
  return (((S.bills||{})[billKeyOf(p)]||{}).status||'未請求')==='未請求'; }
function monthStart(d,off){ return iso(new Date(d.getFullYear(),d.getMonth()+(off||0),1)); }
function isActive(p){ if(p.kind==='long') return true; const t=today(), end=projEnd(p);
  if(end>=monthStart(t)) return true;
  if(end>=monthStart(t,-1)) return hasBill(p)?billPending(p):t.getDate()<=graceDays(); // 請求があるものは「送るまで」、ないものは月初の数日だけ
  return billPending(p)&&end>=monthStart(t,-3); }
function endedTag(p){ const t=today(), end=projEnd(p); if(end>=iso(t)) return ''; return billPending(p)?'終了・請求まだ':'終了'; }
/* ---------- 予定：案件のガント／タスクのガント ----------
 * 案件：準備（最初のタスク〜本番の前日）→ 本番 → 請求（本番の翌日〜請求書を送るまで）を横棒で
 * タスク：始める日 → 期日 を横棒で（始める日が未設定なら、入れた日から）
 * 日付の下に、その日が期日のタスクの数（期）と、その日に進行中のタスクの数（進）を出す
 */
let tlMode=(window.innerWidth<1024?'cal':'proj');
function taskStart(k){ return k.start||(k.createdAt?iso(new Date(k.createdAt)):iso(today())); }
function renderTime(){
  const t=today(), n=iso(t), W=38;
  $('calView').hidden=tlMode!=='cal'; $('tlWrap').hidden=tlMode==='cal'; $('tlLegend').hidden=tlMode==='cal';
  if(tlMode==='cal'){ $('tlBar').innerHTML=`<div class="tlmode"><button type="button" data-act="tlMode" data-m="cal" aria-pressed="true">カレンダー</button><button type="button" data-act="tlMode" data-m="proj" aria-pressed="false">案件のガント</button><button type="button" data-act="tlMode" data-m="task" aria-pressed="false">タスクのガント</button></div>`; renderCal(); return; }
  const ps=[...S.projects].filter(p=>p.kind!=='long'&&isActive(p));
  const open=S.tasks.filter(k=>k.status!=='done');
  // 表示期間：今月の頭（終わった案件があればそこから）〜 先の予定まで
  const firstShow=ps.reduce((m,p)=>p.showDate<m?p.showDate:m,monthStart(t));
  const start=fromIso(firstShow<monthStart(t)?firstShow:monthStart(t));
  let last=n; ps.forEach(p=>{ const e=projEnd(p); if(e>last) last=e; }); open.forEach(k=>{ if(k.due&&k.due>last) last=k.due; });
  const total=Math.min(150,Math.max(dd(t,start)+24,dd(fromIso(last),start)+5));
  const idx=d=>dd(fromIso(d),start);
  // 日ごとの件数
  const dueCnt={}, runCnt={};
  open.forEach(k=>{ if(k.due){ const i=idx(k.due); if(i>=0&&i<total) dueCnt[i]=(dueCnt[i]||0)+1; }

  const bar=(a,b,cls,text,act)=>(i)=>{ if(i!==Math.max(0,a)||a>b||b<0||a>=total) return ''; const s=Math.max(0,a), e=Math.min(total-1,b); const wpx=(e-s+1)*W-6; return `<div class="gbar ${cls}" style="width:${wpx}px" title="${esc(text||'')}" ${act||''}><span>${wpx>=64?(text||''):''}</span></div>`; };

    const live=ps.filter(p=>!endedTag(p)).sort((a,b)=>a.showDate.localeCompare(b.showDate)), done=ps.filter(p=>endedTag(p)).sort((a,b)=>projEnd(b).localeCompare(projEnd(a)));
    const gSelf=live.filter(hasSelfW), gHai=live.filter(p=>!hasSelfW(p)&&hasHai(p)), gOther=live.filter(p=>!hasSelfW(p)&&!hasHai(p));

        const f=bar(Math.min(a,b),b,cls+(k.due?'':' g-nodue'),k.due?md(fromIso(k.due)):'期日なし',`data-act="open" data-id="${k.id}"`);

  scrollTlToday();

      <div class="rn">${esc(s.role)}<small>${esc(s.vendor||'手配先未定')}${s.type==='人出し'?'　人出し':(s.committed?'　確約済み':'　確約まだ')}</small></div>
      <div class="cnt ${c}">${f}/${n}</div>${s.type==='人出し'?`<div class="ok">募集中。上がった人だけ出します（警告は出しません）</div>`:meter(f,n)}
      ${moneyLine(s)}${i?`<div class="why ${i.lv==='fatal'?'fwhy':''}">${i.lv==='fatal'?'<span class="fbadge">至急</span>':''}${esc(i.text)}</div>`:''}</div>`; }).join('');

function ensureProjCreated(){ S.projects.forEach(p=>{ if(!p.createdAt){ const ts=S.tasks.filter(k=>k.projectId===p.id&&k.createdAt).map(k=>+k.createdAt); p.createdAt=ts.length?Math.min(...ts):Date.now(); } }); } // 保存はしない（ほかの変更と一緒に送られる）

function setStatus(k,st){ if(!k||k.status===st) return;
  k.waitingSince=st==='wait'?Date.now():null; k.doneAt=st==='done'?Date.now():null; k.status=st; }
function postpone(k){ const base=k.due&&k.due>iso(today())?fromIso(k.due):today(); k.due=iso(add(base,1)); if(k.status==='inbox'&&k.projectId) k.status='todo'; }

  if(act==='reviewSkip'){ const k=T(a.dataset.id); if(k){ snap(); const pj=P(k.projectId); if(pj){ pj.review=Object.assign({},pj.review||{},{skip:true}); } S.tasks=S.tasks.filter(x=>x.id!==k.id); save(); render(); toast('この案件の振り返りはなしにしました',true); } }

  if(act==='calAddTask'){ openQuickTask(a.dataset.d); return; }

  if(act==='tlToday'){ const tl=$('tl'), w=tl.parentElement; w.scrollTo({left:Math.max(0,+(tl.dataset.today||0)*38-38*3),behavior:'smooth'}); }
  if(act==='sortInbox') openSort();
  if(act==='know') openKnow(a.dataset.pid);
  if(act==='library') openLibrary();
  if(act==='partners') openPartners('c');
  if(act==='clientEdit') openClientEdit(a.dataset.id);
  if(act==='vendorEdit') openVendorEdit(a.dataset.name);

  if(act==='zenAsk') openZenAsk(a.dataset.pid);

/* swipe on list rows */
let sw=null, swipeMoved=false;
document.addEventListener('pointerdown',e=>{ const li=e.target.closest('.task'); if(!li||e.target.closest('.check')) return; if(e.pointerType==='mouse'&&e.button!==0) return;
  sw={li,x:e.clientX,y:e.clientY,dx:0,on:false}; swipeMoved=false; });
document.addEventListener('pointermove',e=>{ if(!sw) return; const dx=e.clientX-sw.x, dy=e.clientY-sw.y;
  if(!sw.on){ if(Math.abs(dx)>12 && Math.abs(dx)>Math.abs(dy)*1.3){ sw.on=true; sw.li.classList.add('dragx'); } else if(Math.abs(dy)>12){ sw=null; return; } else return; }
  sw.dx=Math.max(-140,Math.min(140,dx)); sw.li.querySelector('.face').style.transform=`translateX(${sw.dx}px)`;
  sw.li.classList.toggle('sw-r',sw.dx>0); sw.li.classList.toggle('sw-l',sw.dx<0); });
function swEnd(){ if(!sw) return; const {li,dx,on}=sw; sw=null; if(!on) return; swipeMoved=true; setTimeout(()=>swipeMoved=false,50);
  li.classList.remove('dragx'); const face=li.querySelector('.face'); const k=T(li.dataset.id);
  if(k && Math.abs(dx)>80){ snap(); if(dx>0){ setStatus(k,k.status==='done'?'todo':'done'); toast(k.status==='done'?'完了にしました':'未完了に戻しました',true); }
    else { postpone(k); toast('明日（'+dueLabel(k.due)+'）に回しました',true); }
    face.style.transform=`translateX(${dx>0?'100%':'-100%'})`; save(); setTimeout(render,180); }
  else { face.style.transform=''; li.classList.remove('sw-r','sw-l'); } }
document.addEventListener('pointerup',swEnd); document.addEventListener('pointercancel',swEnd);

/* drag on board */
let drag=null; const boardEl=$('board');
boardEl.addEventListener('pointerdown',e=>{ const h=e.target.closest('.handle'); if(!h) return; e.preventDefault();
  const card=h.closest('.kcard'), r=card.getBoundingClientRect(), g=card.cloneNode(true);
  g.classList.add('ghost'); g.style.width=r.width+'px'; document.body.appendChild(g); card.classList.add('dragging');
  drag={id:card.dataset.id,g,card,dx:e.clientX-r.left,dy:e.clientY-r.top,col:null}; moveDrag(e); });
window.addEventListener('pointermove',e=>{ if(drag){ e.preventDefault(); moveDrag(e);} },{passive:false});
function moveDrag(e){ drag.g.style.transform=`translate(${e.clientX-drag.dx}px,${e.clientY-drag.dy}px) rotate(2deg)`;
  const el=document.elementFromPoint(e.clientX,e.clientY), col=el&&el.closest('.kcol');
  document.querySelectorAll('.kcol.over').forEach(c=>{ if(c!==col) c.classList.remove('over'); }); if(col) col.classList.add('over'); drag.col=col;
  const b=boardEl.getBoundingClientRect(); if(e.clientX>b.right-36) boardEl.scrollLeft+=14; else if(e.clientX<b.left+36) boardEl.scrollLeft-=14; }
function endDrag(){ if(!drag) return; const {g,card,col,id}=drag; g.remove(); card.classList.remove('dragging');
  document.querySelectorAll('.kcol.over').forEach(c=>c.classList.remove('over')); drag=null;
  if(col){ const k=T(id); if(k&&k.status!==col.dataset.st){ snap(); setStatus(k,col.dataset.st); save(); toast('「'+ST[k.status]+'」に移動しました',true); } }
  render(); }
window.addEventListener('pointerup',endDrag); window.addEventListener('pointercancel',endDrag);

function applyTpl(pid,silent){ const p=P(pid); if(!p) return 0; const t=today(), n=iso(t); let made=0, cmp=0;
  (p.modules||[]).map(m=>m==='手配'?(p.haiType||'枠受け'):m).forEach(m=>(TPL[m]||[]).forEach(([title,off])=>{
    if(S.tasks.some(k=>k.projectId===pid&&k.title===title)) return;
    let due=iso(add(fromIso(p.showDate),off)), tag=null; if(due<n){ due=n; tag='圧縮'; cmp++; }
    S.tasks.push(mkTask({title,projectId:pid,due,status:'todo',tag,source:'テンプレ'})); made++; }));
  if(!silent){ if(made){ save(); render(); toast(`逆算タスクを${made}件作りました${cmp?'（うち'+cmp+'件は間に合わないので今日に寄せました）':''}`,true); } else toast('追加できるテンプレのタスクはありません'); }
  return {made,cmp};
}

function boshuText(p,ids,remain,ans){ const sel=(p.slots||[]).filter(s=>ids.includes(s.id));
  const cnt=s=>remain?Math.max(0,(+s.need||0)-filledN(s)):(+s.need||0);
  const one=sel.length===1; const price=s=>s.price?`${s.unit||'日給'}${Number(s.price).toLocaleString('ja-JP')}円${s.trans?'＋'+s.trans.replace(/^交通費(\d)/,'交通費$1'):'（'+transportFor(s.role)+'）'}`:'';
  const block=(h,body)=>body&&body.trim()?`■${h}\n${body.trim()}\n`:'';
  let t='';
  t+=block('案件名',p.nameFull&&p.nameFull.replace(/\n/g,' ')===p.name?p.nameFull:p.name);
  if(p.kind!=='long') t+=block('日程',p.dateText||md(fromIso(p.showDate)));
  t+=block('時間(予定)',[p.workTime,p.timeNote].filter(Boolean).join('\n'));
  if(p.callTime) t+=block('集合',p.callTime);
  t+=p.venue||p.access?`■会場\n${[p.venue,p.venueNote].filter(Boolean).join('\n')}\n${p.access?`\n《アクセス》\n${p.access}\n`:''}`:'';
  t+=block('勤務日数',p.shift); t+=block('雇用期間',p.period); t+=block('業務内容',p.work);
  t+=block('ご依頼枠',sel.map(s=>`${s.role}×${cnt(s)}名${!one&&price(s)?'（'+price(s)+'）':''}`).join('\n'));
  t+=block('服装',p.bring);
  if(one) t+=block('金額',price(sel[0]));
  t+=block('備考/身だしなみ',p.notes);
  if(ans) t+=block('ご回答期限',ans+'　※可否だけでも先にご連絡いただけると助かります');
  return t.replace(/\n■/g,'\n\n■').trim()+'\n━━━━━━━━━━━━'; }

/* =========================================================
   請求書の添付（Googleドライブに保存して、請求・支払にひも付ける）
   保存先：マイドライブ／Lv.OPS／請求書／2026年09月／発行（または受領）
   ファイル名：20260930_株式会社FACT_発行_3,822,390円.pdf（日付・取引先・金額で探せるように）
   ========================================================= */
function readB64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=()=>rej(new Error('読み込めませんでした')); r.readAsDataURL(file); }); }
const safeName=t=>String(t||'').replace(/[\\/:*?"<>|\n\r]/g,'').trim();
function fileExt(f){ const m=(f.name||'').match(/\.([A-Za-z0-9]{1,5})$/); return m?m[1].toLowerCase():(/pdf/.test(f.type)?'pdf':/png/.test(f.type)?'png':'jpg'); }
/* 大きなファイルは、8MBずつに分けて送る（ドライブの「再開できるアップロード」を使うので、数百MBでも入る） */
const CHUNK=8*1024*1024, BIG_MAX=500*1024*1024;
let upProg=null; // 進み具合を画面に出すための関数（あれば）
async function uploadAny(file,area,path,name){ if(!SERVER) throw new Error('スプシにつないでいるときだけ使えます');
  if(file.size>BIG_MAX) throw new Error('ファイルが大きすぎます（500MBまで）。PDFを圧縮するか、分けて入れてください');
  const mime=file.type||'application/octet-stream';
  if(file.size<=CHUNK){ const data=await readB64(file); return api('upload',{area,path,name,mime,data}); }
  const st=await api('upStart',{area,path,name,mime,size:file.size}); let r=null;
  for(let pos=0;pos<file.size;pos+=CHUNK){ const part=file.slice(pos,Math.min(file.size,pos+CHUNK)); const data=await readB64(part);
    let tries=0; for(;;){ try{ r=await api('upChunk',{session:st.session,start:pos,total:file.size,mime,data}); break; }catch(e){ if(++tries>=3) throw e; await new Promise(res=>setTimeout(res,1500)); } }
    if(upProg) upProg(Math.min(100,Math.round((pos+part.size)/file.size*100))); }
  if(!r||!r.done) throw new Error('最後まで送れませんでした。もう一度試してください'); return r; }
async function uploadToDrive(file,path,name){ return uploadAny(file,'請求書',path,name); }

/* =========================================================
   見積書（元請け向け・請け値）と 手配依頼書（手配先向け・支払単価）
   どちらも手配枠のデータからボタン一つで作る

function company(){ const st=S.settings||{}; return {name:st.coName||'株式会社Level up Operations',person:st.coPerson||'中村',reg:st.coReg||'',tel:st.coTel||'',mail:st.coMail||'',addr:st.coAddr||''}; }
const fmtDate=d=>`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
function quoteData(p){ const m=projMoney(p); const lines=m.lines.filter(l=>l.kind==='sale'); const sub=m.sale, tx=tax(sub); return {lines,sub,tx,total:sub+tx}; }
function orderData(p,vendor){ const lines=projMoney(p).lines.filter(l=>l.kind==='cost'&&l.vendor===vendor); const sub=lines.reduce((a,l)=>a+l.amt,0), tx=tax(sub); return {lines,sub,tx,total:sub+tx}; }
function qtyText(l){ return l.unit?`${yen(l.unit)} × ${fmtN(l.qty)}名 × ${fmtN(l.days)}日`:''; }
const fmtN=n=>Number.isInteger(+n)?String(n):String(+(+n).toFixed(2));
function docHTML(o){ const co=company();
  return `<div class="doc">
  <div class="doc-h"><h1>${esc(o.title)}</h1><div class="doc-meta">${o.meta.map(([k,v])=>`<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div></div>
  <div class="doc-to"><b>${esc(o.to)}</b>${o.lead?`<p>${esc(o.lead)}</p>`:''}</div>
  <div class="doc-total"><span>${esc(o.totalLabel)}</span><b>${yen(o.total)}</b><small>（税込）</small></div>
  ${o.info.length?`<table class="doc-info">${o.info.map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v).replace(/\n/g,'<br>')}</td></tr>`).join('')}</table>`:''}
  <table class="doc-t"><thead><tr><th>項目</th><th>単価</th><th>人数</th><th>日数</th><th>金額</th></tr></thead><tbody>
  ${o.lines.map(l=>`<tr><td>${esc(l.label)}</td><td>${l.unit?yen(l.unit):''}</td><td>${l.unit?fmtN(l.qty):''}</td><td>${l.unit?fmtN(l.days):''}</td><td>${yen(l.amt)}</td></tr>`).join('')}
  </tbody><tfoot><tr><td colspan="4">小計</td><td>${yen(o.sub)}</td></tr><tr><td colspan="4">消費税（10%）</td><td>${yen(o.tx)}</td></tr><tr class="gt"><td colspan="4">合計</td><td>${yen(o.total)}</td></tr></tfoot></table>
  ${o.notes?`<div class="doc-notes"><b>備考</b><p>${esc(o.notes).replace(/\n/g,'<br>')}</p></div>`:''}
  <div class="doc-co"><b>${esc(co.name)}</b>${co.addr?`<span>${esc(co.addr)}</span>`:''}<span>担当：${esc(co.person)}${co.tel?'　'+esc(co.tel):''}${co.mail?'　'+esc(co.mail):''}</span>${co.reg?`<span>登録番号：${esc(co.reg)}</span>`:''}</div>
  </div>`; }
function docText(o){ const co=company(); let t=`【${o.title}】\n${o.to}\n\n`;
  o.meta.forEach(([k,v])=>t+=`${k}：${v}\n`); t+='\n'; o.info.forEach(([k,v])=>t+=`${k}：${v.replace(/\n/g,' ／ ')}\n`);
  t+='\n'; o.lines.forEach(l=>t+=`・${l.label}${l.unit?`　${qtyText(l)}`:''}　${yen(l.amt)}\n`);
  t+=`\n小計 ${yen(o.sub)}／消費税(10%) ${yen(o.tx)}／${o.totalLabel} ${yen(o.total)}（税込）\n`;
  if(o.notes) t+=`\n備考：${o.notes.replace(/\n/g,' ／ ')}\n`;
  t+=`\n${co.name}　担当：${co.person}${co.tel?' '+co.tel:''}${co.reg?`\n登録番号：${co.reg}`:''}`; return t; }
function docTSV(o){ let t='項目\t単価\t人数\t日数\t金額\n'; o.lines.forEach(l=>t+=`${l.label}\t${l.unit||''}\t${l.unit?l.qty:''}\t${l.unit?l.days:''}\t${l.amt}\n`);
  t+=`小計\t\t\t\t${o.sub}\n消費税（10%）\t\t\t\t${o.tx}\n合計\t\t\t\t${o.total}\n`; return t; }
function printDoc(html){ let pa=$('printArea'); if(!pa){ pa=document.createElement('div'); pa.id='printArea'; document.body.appendChild(pa); } pa.innerHTML=html;

/* =========================================================
   スプシ連携（本物のWebアプリ版）
   ・接続コード（データ窓口のURL＋合言葉）をこの端末に覚えておき、fetchでGASに読み書きする
   ・変わった行だけを送る。電波がないときは端末に残し、戻ったら送る（アプリを閉じても消えない）
   ========================================================= */
const CONF_KEY='lvops_conf', BASE_KEY='lvops_base', PEND_KEY='lvops_pending';
function getConf(){ try{ return JSON.parse(localStorage.getItem(CONF_KEY)||'null'); }catch(e){ return null; } }
function setConf(c){ try{ localStorage.setItem(CONF_KEY,JSON.stringify(c)); }catch(e){} }

/* =========================================================
   前日確認（前確）
   ・送る日＝本番の前の「営業日」（平日。土日祝は除く）
     平日の本番→前日／月曜や連休明けの本番→その前の金曜（祝日なら木曜…）
   ・人を手配している案件には「前確を送る」タスクを自動で置き、本番日が変われば送る日も追従
   ・前確に必要な情報（集合・会場・稼働時間・服装・現場連絡先）が足りなければ、前もって知らせる
