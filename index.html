const _hol={};
function jpHolidays(y){ if(_hol[y]) return _hol[y]; const H=new Set(), f=(m,d)=>H.add(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  const nthMon=(m,n)=>{ const d1=new Date(y,m-1,1).getDay(); return 1+((8-d1)%7)+(n-1)*7; };
  f(1,1); f(1,nthMon(1,2)); f(2,11); f(2,23); f(4,29); f(5,3); f(5,4); f(5,5); f(7,nthMon(7,3)); f(8,11); f(9,nthMon(9,3)); f(10,nthMon(10,2)); f(11,3); f(11,23);
  f(3,Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4))); f(9,Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4)));

  return _hol[y]=H; }

    const k0=S.tasks.find(t=>t.projectId===p.id&&t.tag==='前確'&&t.raw==='自動：前日確認'&&t.status!=='done'); if(k0){ S.tasks=S.tasks.filter(t=>t!==k0); ch=true; }
    p.sessions.forEach(x=>{ if(x.date<n) return; const due=zenDate({showDate:x.date}), key='自動：前日確認#'+x.id; let k=S.tasks.find(t=>t.projectId===p.id&&t.tag==='前確'&&t.raw===key);
      if(dd(fromIso(due),today())>zenLead()){ if(k&&k.status!=='done'){ S.tasks=S.tasks.filter(t=>t!==k); ch=true; } return; }
      const title=`前確を送る（${md(fromIso(x.date))} ${x.venue||'場所未定'}）`;
      if(!k){ S.tasks.push(mkTask({title,raw:key,source:'自動',projectId:p.id,due,status:'todo',createdAt:Date.now(),tag:'前確'})); ch=true; }
      else if(k.status!=='done'&&(k.due!==due||k.title!==title)){ k.due=due; k.title=title; ch=true; } }); });
  S.projects.forEach(p=>{ if(!needsZen(p)||hasSess(p)||p.showDate<n) return; const due=zenDate(p);
    let k=S.tasks.find(t=>t.projectId===p.id&&t.tag==='前確');

function ensureReviewTasks(){ let ch=false; const lim=iso(add(today(),-10)), n=iso(today());
  if(!reviewOn()){ const before=S.tasks.length; S.tasks=S.tasks.filter(t=>!(t.tag==='振り返り'&&t.status!=='done'&&t.source==='自動')); if(S.tasks.length!==before) save(); return; }
  S.projects.forEach(p=>{ if(p.kind==='long'||!p.showDate) return; const end=projEnd(p);
    const k=S.tasks.find(t=>t.projectId===p.id&&t.tag==='振り返り');
    // 本番の最終日より前は出さない（前に作られていたものは一度下げる）。最終日になったら、最終日〜2営業日後で置く
    if(n<end){ if(k&&k.status!=='done'&&k.source==='自動'){ S.tasks=S.tasks.filter(t=>t!==k); ch=true; } return; }
    if(k){ if(k.status!=='done'&&k.source==='自動'&&k.start!==end){ k.start=end; k.due=iso(addBizDays(fromIso(end),2)); ch=true; } return; }
    if(end<lim||(p.review&&p.review.skip)) return;
    const due=iso(addBizDays(fromIso(end),2)); if(due<n) return; // すでに期限を過ぎた過去の案件には置かない（ためこまない）
    S.tasks.push(mkTask({title:'振り返りを書く（うまくいったこと・困ったこと・申し送り・会場メモ）',raw:'自動：振り返り',source:'自動',projectId:p.id,start:end,due,status:'todo',createdAt:Date.now(),tag:'振り返り'})); ch=true; });
  if(ch) save(); }

  L.push('## 振り返り',`### うまくいったこと`,r.good||'（未記入）',`### 困ったこと・トラブル`,r.bad||'（未記入）',`### 次回への申し送り`,r.next||'（未記入）',`### 会場メモ（搬入口・電源・駐車場・控室など）`,r.venue||'（未記入）','');
  if(docs.length){ L.push('## 資料と見どころ'); docs.forEach(d=>L.push(`- 【${d.kind}】${d.title}${d.rating?'　評価'+'★'.repeat(+d.rating):''}${(d.points||[]).length?'　参考にしたい点：'+d.points.join('・'):''}${d.good?'　'+d.good:''}${d.url?'　'+d.url:''}`)); L.push(''); }

/* =========================================================
   受信箱の仕分け
   ・呼び名が入っていなくても、案件名の一部・会場・元請けの担当者名などから案件を推測する
   ・受信箱の「まとめて仕分け」で、推測した案件と期日をワンタップで確定できる
   ========================================================= */
const TOKEN_STOP=new Set(['本番','準備日','事務局','運営','手配','スタッフ','案件','会場','イベント','ブース','東京','大阪','名古屋市','株式会社','合同会社','準備','撤去','設営']);
const nz=t=>String(t||'').normalize('NFKC').toLowerCase();
function projTokens(p){ const src=[p.name,...(p.alias||[]),p.venue||'',p.client||'',cname(clientOf(p)).replace(/株式会社|合同会社|有限会社/g,'')].join(' ');
  return [...new Set(src.replace(/^\d{4,6}(-\d{1,4})?_?/,'').split(/[\s_\-・／\/（）()【】「」、。,.:：+＋\d]+/).filter(w=>w.length>=2&&!TOKEN_STOP.has(w)))]; }
function suggestProjects(text,limit){ const t=nz(text); const lim=iso(add(today(),-45));
  return S.projects.filter(p=>p.kind==='long'||projEnd(p)>=lim).map(p=>{ let sc=0, hit='';
    [p.name,...(p.alias||[])].forEach(a=>{ if(a&&t.includes(nz(a))){ sc+=100+a.length; if(a.length>hit.length) hit=a; } });
    projTokens(p).forEach(w=>{ const W=nz(w); if(t.includes(W)){ sc+=W.length*3; if(!hit||W.length>hit.length) hit=hit||w; } else if(W.length>=4){ outer: for(let k=W.length-1;k>=3;k--){ for(let i=0;i+k<=W.length;i++){ if(t.includes(W.substr(i,k))){ sc+=k; break outer; } } } } });
    if(sc>0){ const d=Math.abs(dd(fromIso(p.showDate),today())); sc+=Math.max(0,3-d/10); }
    return {p,sc,hit}; }).filter(x=>x.sc>=3).sort((a,b)=>b.sc-a.sc).slice(0,limit||3); }
function openSort(){ const box=S.tasks.filter(k=>k.status==='inbox'); if(!box.length){ toast('受信箱は空です'); return; }
  const t=today(), fri=add(t,((5-t.getDay()+7)%7)||7), mon=add(t,((1-t.getDay()+7)%7)||7);
  const pick={}; box.forEach(k=>{ const r=parse(k.raw||k.title,{}); const sg=suggestProjects(k.raw||k.title); pick[k.id]={pid:(r.proj&&r.proj.id)||(sg[0]&&sg[0].p.id)||'',due:r.due||k.due||'',sg}; });
  const nn=iso(today()); const actives=[...S.projects.filter(p=>p.kind==='long'||projEnd(p)>=nn).sort((a,b)=>a.showDate.localeCompare(b.showDate)),...S.projects.filter(p=>!(p.kind==='long'||projEnd(p)>=nn)).sort((a,b)=>projEnd(b).localeCompare(projEnd(a)))];
  const row=k=>{ const s=pick[k.id]; const chips=[...s.sg.map(x=>x.p)]; if(s.pid&&!chips.some(p=>p.id===s.pid)&&P(s.pid)) chips.unshift(P(s.pid));
    return `<div class="sortrow" data-id="${k.id}"><div class="st">${esc(k.title)}</div>
      <div class="seg sm" data-k="pid">${chips.map(p=>`<button type="button" data-v="${p.id}" aria-pressed="${s.pid===p.id}">${esc(short(p))}</button>`).join('')}<button type="button" data-v="" aria-pressed="${!s.pid}">案件なし</button>
        <select data-k="pidsel" aria-label="ほかの案件"><option value="">ほかの案件…</option>${actives.filter(p=>!chips.some(c=>c.id===p.id)).map(p=>`<option value="${p.id}">${esc(short(p))}</option>`).join('')}</select></div>
      <div class="seg sm" data-k="due">${[[iso(t),'今日'],[iso(add(t,1)),'明日'],[iso(fri),'金曜'],[iso(mon),'来週月曜'],['','期日なし']].map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${s.due===v}">${l}</button>`).join('')}${s.due&&![iso(t),iso(add(t,1)),iso(fri),iso(mon)].includes(s.due)?`<button type="button" data-v="${s.due}" aria-pressed="true">${md(fromIso(s.due))}</button>`:''}</div>
      <div class="sa"><button type="button" class="btn sm primary" data-ok>この内容で確定</button></div></div>`; };
  openSheet(`<h3>受信箱を仕分ける　<span style="font-weight:400;color:var(--sub);font-size:14px">${box.length}件</span></h3>
  <p class="hint" style="margin-top:0">文章から案件と期日を推測して選んであります。違うところだけ押し直して「確定」してください。</p>
  <div id="sortList">${box.map(row).join('')}</div>
  <div class="acts"><button class="btn" id="so-close">閉じる</button><button class="btn primary" id="so-all">すべてこの内容で確定</button></div>`);
  const commit=id=>{ const k=S.tasks.find(x=>x.id===id), s=pick[id]; if(!k) return; k.projectId=s.pid||null; k.due=s.due||null; k.status='todo';

  $('sortList').addEventListener('click',e=>{ const r=e.target.closest('.sortrow'); if(!r) return; const id=r.dataset.id;
    const b=e.target.closest('.seg button'); if(b){ const k=b.parentElement.dataset.k; pick[id][k]=b.dataset.v; [...b.parentElement.querySelectorAll('button')].forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false')); if(k==='pid') r.querySelector('select').value=''; return; }
    if(e.target.closest('[data-ok]')){ snap(); commit(id); save(); render(); r.remove(); toast('仕分けました',true); if(!$('sortList').children.length) closeSheet(); } });
  $('sortList').addEventListener('change',e=>{ const sel=e.target.closest('select'); if(!sel) return; const r=sel.closest('.sortrow'); pick[r.dataset.id].pid=sel.value; if(sel.value) [...r.querySelectorAll('[data-k="pid"] button')].forEach(x=>x.setAttribute('aria-pressed','false')); });
  $('so-close').onclick=closeSheet;
  $('so-all').onclick=()=>{ snap(); [...$('sortList').children].forEach(r=>commit(r.dataset.id)); save(); closeSheet(); render(); toast('まとめて仕分けました',true); }; }

/* =========================================================

  if(isMonth){ h+=`<div class="calmonths">${Array.from({length:12},(_,i)=>{ const v=`${y}-${String(i+1).padStart(2,'0')}`; return `<button type="button" data-cv="${v}" class="${v===cur?'sel':''} ${v===iso(today()).slice(0,7)?'td':''}">${i+1}月</button>`; }).join('')}</div>
      <div class="calq"><button type="button" data-cv="${iso(today()).slice(0,7)}">今月</button><button type="button" data-cv="">なし</button></div>`; }
  else { const first=new Date(y,m-1,1), start=add(first,-first.getDay()); const n=iso(today());
    const marks=new Set(S.projects.filter(p=>p.kind!=='long').map(p=>p.showDate));
    h+=`<div class="calgrid">${[...WD].map((w,i)=>`<i class="${i===0?'sun':i===6?'sat':''}">${w}</i>`).join('')}`;
    for(let i=0;i<42;i++){ const d=add(start,i), v=iso(d), out=d.getMonth()!==m-1, hol=isHoliday(d);
      h+=`<button type="button" data-cv="${v}" class="${out?'out':''} ${d.getDay()===0||hol?'sun':d.getDay()===6?'sat':''} ${v===n?'td':''} ${v===cur?'sel':''}" title="${hol?'祝日':''}">${d.getDate()}${marks.has(v)?'<em></em>':''}</button>`; }
    h+=`</div><div class="calq"><button type="button" data-cv="${n}">今日</button><button type="button" data-cv="${iso(add(today(),1))}">明日</button><button type="button" data-cv="${iso(add(today(),((1-today().getDay()+7)%7)||7))}">来週月曜</button>${inp.dataset.nonull?'':'<button type="button" data-cv="">なし</button>'}</div>`; }

function calOpen(inp){ calClose(); calInp=inp; const isMonth=inp.dataset.cal==='month'; const v=inp.value||(isMonth?iso(today()).slice(0,7):iso(today()));
  calYM=[+v.slice(0,4),+(v.slice(5,7)||1)]; calEl=document.createElement('div'); calEl.className='calpop'; calEl.setAttribute('role','dialog'); calEl.setAttribute('aria-label','日付を選ぶ');
  (inp.closest('.sheet')||document.body).appendChild(calEl); calPaint();
  const r=inp.getBoundingClientRect(), host=calEl.offsetParent?calEl.offsetParent.getBoundingClientRect():{left:0,top:0}, W=Math.min(300,window.innerWidth-16);
  let left=r.left-host.left, top=r.bottom-host.top+4; if(r.left+W>window.innerWidth-8) left=window.innerWidth-8-W-host.left;
  if(r.bottom+330>window.innerHeight && r.top>340) top=r.top-host.top-4-calEl.offsetHeight;
  calEl.style.left=Math.max(8-host.left,left)+'px'; calEl.style.top=top+(calEl.offsetParent&&calEl.offsetParent.scrollTop||0)+'px'; calEl.style.width=W+'px';
  calEl.addEventListener('click',e=>{ e.stopPropagation(); const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.cn){ const d=+b.dataset.cn; if(calInp.dataset.cal==='month') calYM[0]+=d; else { let [y,m]=calYM; m+=d; if(m<1){m=12;y--;} if(m>12){m=1;y++;} calYM=[y,m]; } calPaint(); return; }
    if(b.dataset.cv!==undefined) calSet(b.dataset.cv); }); }

/* =========================================================
   お金の1行入力：「UMACA 請け3万 払い2.5万 Workyou」「ツーリズム 請け2万×19日」
   ・案件名（呼び名）と「請け」「払い」の金額があれば、その案件の追加としてお金に入る
   ========================================================= */
const MONEY_WORD=/請け|請求額|売上|払い|支払額/;
function moneyGrab(t,kw){ const m=t.match(new RegExp('(?:'+kw+')値?\\s*[:：]?\\s*((?:\\d+(?:\\.\\d+)?\\s*万\\s*(?:\\d+\\s*千)?\\s*\\d*)|(?:\\d+(?:\\.\\d+)?\\s*千)|(?:[\\d,]+))\\s*円?(?:\\s*[×xX*]\\s*(\\d+(?:\\.\\d+)?)\\s*(日|名|人|回|時間|h)?)?'));
  if(!m) return null; const unit=expAmount(/[万千]/.test(m[1])?m[1]:m[1]+'円'); if(!unit) return null; const q=m[2]?+m[2]:1; return {unit,qty:q,per:m[3]||'',amt:Math.round(unit*q),src:m[0]}; }
function parseMoneyLine(v){ const t=v.normalize('NFKC'); if(!MONEY_WORD.test(t)) return null;
  const s=moneyGrab(t,'請け|請求額|売上'), c=moneyGrab(t,'払い|支払額'); if(!s&&!c) return null;
  const r=parse(t,{}); const vend=vendorNamesAll().sort((a,b)=>b.length-a.length).find(n=>t.includes(n))||'';
  let label=t; [s&&s.src,c&&c.src,r.hit,vend].filter(Boolean).forEach(x=>label=label.replace(x,' ')); label=label.replace(/\s{2,}/g,' ').trim()||'稼働';
  return {s,c,proj:r.proj,vend,label}; }
function moneyPreview(m){ const f=x=>x?`${yen(x.unit)}${x.qty!==1?`×${fmtN(x.qty)}${x.per||''}`:''}＝${yen(x.amt)}`:'—';
  return `<span class="boshu">お金として入れます</span><span class="multi">${m.proj?esc(short(m.proj)):'<b style="color:var(--purple)">案件名を入れてください</b>'}</span><span class="multi">請け ${f(m.s)}</span><span class="multi">払い ${f(m.c)}${m.vend?'（'+esc(m.vend)+'）':''}</span><button type="button" data-ign="money" class="off">タスクとして入れる</button>`; }
function addMoneyText(m){ snap(); const p=m.proj; p.extras=p.extras||[];
  p.extras.push({id:uid(),label:m.label+(m.s&&m.s.qty!==1?`（${yen(m.s.unit)}×${fmtN(m.s.qty)}${m.s.per||''}）`:''),sell:m.s?String(m.s.amt):'',cost:m.c?String(m.c.amt):'',vendor:m.c?(m.vend||'手配先未定'):''});

/* =========================================================
   消費税の概算（納税のときに見る）
   ・売上の消費税（預かった分）− 支払の消費税（差し引ける分）＝ 納める額の目安
   ・インボイス登録番号のない手配先は、経過措置で 2026/9まで80%・2026/10〜2029/9は50% だけ差し引ける
   ・2割特例（売上の消費税×20%）も並べて出す
   ========================================================= */
function vendorDeductRate(name,bm){ const v=(S.vendors||[]).find(x=>x.name===name); if(v&&v.regNo) return 1; return bm<='2026-09'?0.8:bm<='2029-09'?0.5:0; }
function taxFor(months){ const set=new Set(months); let out=0, inPay=0, inExp=0, noReg=new Set();
  billsAll().filter(b=>set.has(b.bm)).forEach(b=>{ out+=tax(b.rsale); });
  paysAll().filter(v=>set.has(v.bm)).forEach(v=>{ const r=vendorDeductRate(v.vendor,v.bm); if(r<1) noReg.add(v.vendor); const t=vNoTax(v.vendor)?Math.floor(v.ramt*10/110):vtax(v.vendor,v.ramt); inPay+=Math.floor(t*r); });
  expItems(months).forEach(i=>{ if(isNoTax(i.x)||NON_EXP.has(i.x.acct)) return; inExp+=Math.max(0,(i.gross||0)-(i.net||0)); });
  const pay=out-inPay-inExp; return {out,inPay,inExp,pay,twenty:Math.floor(out*0.2),noReg:[...noReg]}; }
function taxBlock(months,title){ const t=taxFor(months);
  return `<div class="sec"><h2>${title||'消費税（概算）'}</h2><ul class="mlist">
  <li class="mrow"><div class="ml"><b>売上にかかる消費税</b><span>元請けから預かった分</span></div><div class="mr"><em>${yen(t.out)}</em></div></li>
  <li class="mrow"><div class="ml"><b>手配先への支払の消費税</b><span>差し引ける分${t.noReg.length?`（登録番号のない ${esc(t.noReg.slice(0,3).join('・'))}${t.noReg.length>3?' ほか':''} は一部だけ）`:''}</span></div><div class="mr"><em>−${yen(t.inPay)}</em></div></li>
  <li class="mrow"><div class="ml"><b>経費の消費税</b><span>給与・返済など消費税のないものは除く</span></div><div class="mr"><em>−${yen(t.inExp)}</em></div></li>
  <li class="mrow"><div class="ml"><b>納める額の目安（原則の計算）</b><span>2割特例を使う場合は ${yen(t.twenty)}</span></div><div class="mr"><em style="color:var(--teal)">${yen(Math.max(0,t.pay))}</em></div></li></ul>
  <p class="hint">稼働した月で集計した概算です。インボイス登録番号が入っていない手配先は、未登録として一部だけ差し引いています（取引先の画面で登録番号を入れると正しくなります）。実際の納税額と、原則・簡易課税・2割特例のどれを使うかは、税理士さんに確認してください。</p></div>`; }
/* 売掛（まだ入金されていない）と買掛（まだ払っていない）の残り */

const taskOpen=new Set();
function listGrouped(arr,scope,limit){ limit=limit||3; const groups=[], idx={};
  arr.forEach(k=>{ const g=k.projectId||'_'; if(!(g in idx)){ idx[g]=groups.length; groups.push({g,items:[]}); } groups[idx[g]].items.push(k); });
  return `<ul class="tasks">${groups.map(({g,items})=>{ const key=scope+'|'+g, open=taskOpen.has(key)||items.length<=limit+1; const shown=open?items:items.slice(0,limit);

let calM=null, calSel=null;

  for(let i=0;i<42;i++){ const d=add(start,i), v=iso(d); if(i>=35&&d.getMonth()!==m-1) break;
    const out=d.getMonth()!==m-1, hol=isHoliday(d), list=on(v), dn=dueN(v), zn=zenOn(v).length;
    h+=`<button type="button" class="cd ${out?'out':''} ${v===n?'td':''} ${v===calSel?'sel':''} ${d.getDay()===0||hol?'sun':d.getDay()===6?'sat':''}" data-act="calPick" data-d="${v}">
      <span class="dn">${d.getDate()}</span>
      ${(()=>{ const span=p=>hasSess(p)?1:dd(fromIso(projEnd(p)),fromIso(p.showDate))+1; const lng=list.filter(p=>span(p)>7), sh=list.filter(p=>span(p)<=7);
        return lng.slice(0,2).map(p=>`<span class="cl ${endedTag(p)?'end':''} ${p.showDate===v?'st':''} ${projEnd(p)===v?'en':''}" title="${esc(p.name)}">${p.showDate===v||d.getDay()===0||d.getDate()===1?esc(short(p)):''}</span>`).join('')
          +sh.slice(0,2).map(p=>{ const x=sessOn(p,v); return `<span class="cp ${endedTag(p)?'end':''} ${(x?x.date:p.showDate)===v?'st':''} ${(x?sessEnd(x):projEnd(p))===v?'en':''} ${x&&(x.tbd||!x.venue)?'tbd':''}">${esc(short(p))}</span>`; }).join('')
          +(sh.length>2||lng.length>2?`<span class="cmore">+${Math.max(0,sh.length-2)+Math.max(0,lng.length-2)}</span>`:''); })()}
      <span class="cdots">${zn?'<i class="z" title="前確"></i>':''}${dn?`<i class="k">${dn}</i>`:''}</span></button>`; }
  h+=`</div></div>`;
  // 選んだ日の中身
  const d0=fromIso(calSel), list=on(calSel), zens=zenOn(calSel), ks=S.tasks.filter(k=>k.status!=='done'&&k.due===calSel);
  h+=`<div class="calday"><div class="caldh"><b>${d0.getMonth()+1}月${d0.getDate()}日（${WD[d0.getDay()]}）${isHoliday(d0)?'<small>祝日</small>':''}</b>
    <div><button type="button" class="btn sm primary" data-act="calAddProj" data-d="${calSel}">＋ 案件</button><button type="button" class="btn sm" data-act="calAddTask" data-d="${calSel}">＋ タスク</button></div></div>
    ${list.length?`<div class="calsec"><span class="lb">本番</span>${list.map(p=>{ const m2=projMoney(p), x=sessOn(p,calSel); return `<button type="button" class="calrow" data-act="gotoProj" data-pid="${p.id}"><b>${esc(p.name)}</b>${x?`<span class="sessl">${x.tbd||!x.venue?'<b class="tbd">場所未定</b>':'＠'+esc(x.venue)}${x.time?'　'+esc(x.time):''}</span><br>`:''}<span>${esc(p.dateText||md(fromIso(p.showDate)))}　${esc(cname(clientOf(p)))}${m2.sale?'　売上 '+yen(m2.sale):''}${endedTag(p)?'　'+endedTag(p):''}</span></button>`; }).join('')}</div>`:''}
    ${zens.length?`<div class="calsec"><span class="lb">前確を送る日</span>${zens.flatMap(p=>hasSess(p)?p.sessions.filter(x=>x.date>=n&&zenDate({showDate:x.date})===calSel).map(x=>`<button type="button" class="calrow z" data-act="zen" data-pid="${p.id}" data-sid="${x.id}"><b>${esc(short(p))}の前確</b><span>${esc(sessLabel(x))}</span></button>`):[`<button type="button" class="calrow z" data-act="zen" data-pid="${p.id}"><b>${esc(short(p))}の前確</b><span>本番 ${md(fromIso(p.showDate))}</span></button>`]).join('')}</div>`:''}
    <div class="calsec"><span class="lb">時間の予定</span>${dayTimeline(calSel,S.tasks.filter(k=>k.status!=='done'&&k.due===calSel),list)}</div>
    ${ks.length?`<div class="calsec"><span class="lb">期日のタスク</span>${list_(ks)}</div>`:''}
    ${!list.length&&!zens.length&&!ks.length?'<div class="empty">この日の予定はありません。「＋ 案件」「＋ タスク」からすぐ入れられます。</div>':''}</div>`;
  $('calView').innerHTML=h; }

/* =========================================================
   複数日・複数現場の案件（1つの案件の中に「現場」を並べる）
   ・現場ごとに 日付（〜最終日）・場所・時間・集合 を持てる。場所が未定の現場も置ける
   ・手配の枠は現場にひも付けられる（現場ごとに手配先がバラバラでもOK）
   ・請求は案件のまま（1件の請求書）
   ・前確は現場ごとに送る日を計算して、現場ごとにタスクを置く
   ========================================================= */
function hasSess(p){ return !!(p&&Array.isArray(p.sessions)&&p.sessions.length); }
function sessEnd(x){ return x.end&&x.end>=x.date?x.end:x.date; }
function sessDays(x){ const out=[]; for(let d=fromIso(x.date);iso(d)<=sessEnd(x);d=add(d,1)) out.push(iso(d)); return out; }
function sessLabel(x){ return `${x.end&&x.end>x.date?md(fromIso(x.date))+'〜'+md(fromIso(x.end)):md(fromIso(x.date))}${x.tbd||!x.venue?'　場所未定':'　'+x.venue}`; }
function syncSess(p){ if(!hasSess(p)) return; p.sessions.sort((a,b)=>a.date.localeCompare(b.date)); const f=p.sessions[0].date, l=p.sessions.map(sessEnd).sort().slice(-1)[0];
  p.showDate=f; p.dateText=(f===l?md(fromIso(f)):`${md(fromIso(f))}〜${md(fromIso(l))}`)+`（${p.sessions.length}現場）`; }
function projOnDay(p,d){ if(hasSess(p)) return p.sessions.some(x=>x.date<=d&&sessEnd(x)>=d); return p.showDate<=d&&projEnd(p)>=d; }
function sessOn(p,d){ return hasSess(p)?p.sessions.find(x=>x.date<=d&&sessEnd(x)>=d):null; }
/* 「10/10(土)～11(日)＠みなと区民まつり」「9:45～16:45」のような文から現場を読む */
function parseSessText(t){ const out=[]; const y=today().getFullYear(); const lines=String(t).normalize('NFKC').split(/\n/).map(x=>x.trim()).filter(Boolean);
  lines.forEach(line=>{ const m=line.match(/(\d{1,2})\/(\d{1,2})(?:\([^)]*\))?(?:\s*[~〜～\-]\s*(?:(\d{1,2})\/)?(\d{1,2})(?:\([^)]*\))?)?\s*(?:[@＠]\s*(.*))?/);
    const tm=line.match(/(\d{1,2})\s*[:：]\s*(\d{2})\s*[~〜～\-]\s*(\d{1,2})\s*[:：]\s*(\d{2})/);
    if(m&&!tm){ let d=new Date(y,+m[1]-1,+m[2]); if(d<add(today(),-60)) d.setFullYear(y+1); let e='';
      if(m[4]){ const em=m[3]?+m[3]:+m[1]; let ed=new Date(d.getFullYear(),em-1,+m[4]); if(ed<d) ed.setFullYear(ed.getFullYear()+1); e=iso(ed); }
      const v=(m[5]||'').trim(); out.push({id:uid(),date:iso(d),end:e,venue:/未定/.test(v)?'':v,tbd:!v||/未定/.test(v),time:''}); }
    else if(tm&&out.length){ out[out.length-1].time=`${+tm[1]}:${tm[2]}〜${+tm[3]}:${tm[4]}`; } });
  return out; }
function sessBlock(p){ if(!hasSess(p)) return `<div style="display:flex"><button class="addslot" data-act="sessPaste" data-pid="${p.id}" style="flex:1">スケジュールを貼って現場を入れる</button><button class="addslot" data-act="sessEdit" data-pid="${p.id}" data-sid="" style="flex:1">＋ 現場を1つずつ入れる</button></div>`;
  return `<div class="slots sessbox"><div class="slh">現場・日程<span class="tot">${p.sessions.length}現場</span></div>
  ${p.sessions.map(x=>{ const sl=(p.slots||[]).filter(s=>s.sessionId===x.id); return `<div class="sline" data-act="sessEdit" data-pid="${p.id}" data-sid="${x.id}" role="button" tabindex="0">
    <div class="rn">${esc(x.end&&x.end>x.date?md(fromIso(x.date))+'〜'+md(fromIso(x.end)):md(fromIso(x.date)))}<small>${x.tbd||!x.venue?'<b class="tbd">場所未定</b>':esc(x.venue)}${x.time?'　'+esc(x.time):''}</small></div>
    <div class="cnt">${sl.length?esc([...new Set(sl.map(s=>s.vendor||'手配先未定'))].join('・')):''}</div></div>`; }).join('')}
  <div style="display:flex"><button class="addslot" data-act="sessEdit" data-pid="${p.id}" data-sid="">＋ 現場を追加</button><button class="addslot" data-act="sessPaste" data-pid="${p.id}">スケジュールを貼って追加</button></div></div>`; }

  <div class="acts">${x?'<button class="btn danger" id="se-del">この現場を消す</button>':'<span></span>'}<div style="display:flex;gap:8px"><button class="btn" id="se-close">閉じる</button><button class="btn primary" id="se-save">保存</button></div></div>
  <p class="hint">手配先がこの現場だけ違うときは、「手配とお金」で手配の行の「現場」を選んでください。請求は、この案件1件としてまとめて出します。</p>`);
  $('se-close').onclick=closeSheet;
  $('se-save').onclick=()=>{ snap(); const o=x||{id:uid()}; Object.assign(o,{date:$('se-d').value||d.date,end:$('se-e').value&&$('se-e').value>($('se-d').value||d.date)?$('se-e').value:'',venue:$('se-v').value.trim(),tbd:$('se-tbd').checked||!$('se-v').value.trim(),time:$('se-t').value.trim(),callTime:$('se-c').value.trim(),callPlace:$('se-cp').value.trim(),contact:$('se-ct').value.trim()});
    if(!x) p.sessions.push(o); syncSess(p); save(); closeSheet(); render(); toast('現場を保存しました',true); };
  if($('se-del')) $('se-del').onclick=()=>{ if(!confirm('この現場を消しますか？（ひも付いた手配の枠は「全日程」に戻ります）')) return; snap(); p.sessions=p.sessions.filter(y=>y!==x); (p.slots||[]).forEach(s=>{ if(s.sessionId===x.id) s.sessionId=''; }); if(!p.sessions.length) delete p.sessions; else syncSess(p); save(); closeSheet(); render(); toast('消しました',true); }; }
function openSessPaste(pid){ const p=P(pid); if(!p) return;
  openSheet(`<h3>スケジュールを貼って現場を入れる</h3><p class="hint" style="margin-top:0">元請けから来たスケジュールをそのまま貼ってください。「10/10(土)～11(日)＠みなと区民まつり」の行と、その下の「9:45～16:45」の行を読みます。場所が未定の日は「10/11＠未定」と書けば入ります。</p>
  <textarea id="sp-t" class="copyarea" style="min-height:180px" placeholder="10/10(土)～11(日)＠みなと区民まつり&#10;9：45～16：45"></textarea><div id="sp-pv" class="pvlist" style="margin-top:8px"></div>
  <div class="acts"><button class="btn" id="sp-close">閉じる</button><button class="btn primary" id="sp-go">この内容で入れる</button></div>`);
  const pv=()=>{ const xs=parseSessText($('sp-t').value); $('sp-pv').innerHTML=xs.map(x=>`<div><b>${esc(sessLabel(x).split('　')[0])}</b><span>${esc(x.venue||'場所未定')}${x.time?'　'+esc(x.time):''}</span></div>`).join('')||'<div><span>まだ読み取れる日程がありません</span></div>'; };
  $('sp-t').addEventListener('input',pv); $('sp-close').onclick=closeSheet;
  $('sp-go').onclick=()=>{ const xs=parseSessText($('sp-t').value); if(!xs.length){ toast('日程が読み取れませんでした'); return; } snap(); p.sessions=(p.sessions||[]).concat(xs); syncSess(p); save(); closeSheet(); render(); toast(`現場を${xs.length}件入れました`,true); }; }

/* =========================================================
   時間の予定（打ち合わせなど）：タスクに時刻を持たせ、カレンダーの日の中を時間で見る
   ========================================================= */
function parseTime(t){ const m=String(t).normalize('NFKC').match(/(\d{1,2})\s*(?::|時(?!間))\s*(\d{2})?\s*分?(?:\s*[~〜～\-]\s*(\d{1,2})\s*(?::|時(?!間))\s*(\d{2})?)?/); if(!m) return null;
  const h=+m[1]; if(h>23) return null; const s=`${String(h).padStart(2,'0')}:${m[2]||'00'}`; const e=m[3]!==undefined&&+m[3]<=24?`${String(+m[3]).padStart(2,'0')}:${m[4]||'00'}`:''; return {time:s,endTime:e,src:m[0]}; }
function tmin(s){ const m=String(s||'').match(/(\d{1,2}):(\d{2})/); return m?+m[1]*60+ +m[2]:null; }
function dayTimeline(d,tasks,projs){ const items=[];
  tasks.filter(k=>k.time).forEach(k=>{ const a=tmin(k.time), b=tmin(k.endTime)||a+60; items.push({a,b,label:k.title,cls:'tk',act:`data-act="open" data-id="${k.id}"`}); });
  projs.forEach(p=>{ const x=sessOn(p,d); const tt=String((x&&x.time)||p.workTime||'').normalize('NFKC').match(/(\d{1,2})\s*[:：]\s*(\d{2})\s*[~〜～\-]\s*(\d{1,2})\s*[:：]\s*(\d{2})/);
    if(tt){ items.push({a:+tt[1]*60+ +tt[2],b:+tt[3]*60+ +tt[4],label:`${short(p)}${x&&x.venue?'＠'+x.venue:''}`,cls:'pj',act:`data-act="gotoProj" data-pid="${p.id}"`}); } });
  if(!items.length) return '<p class="hint">時間の決まった予定はありません。タスクに「14:00」のように時刻を書くと、ここに並びます。</p>';
  const lo=Math.max(0,Math.min(8*60,...items.map(i=>i.a))-0), hi=Math.min(24*60,Math.max(19*60,...items.map(i=>i.b))); const H0=Math.floor(lo/60), H1=Math.ceil(hi/60), PX=44;
  // 重なる予定は横に並べる
  items.sort((x,y)=>x.a-y.a); const lanes=[]; items.forEach(i=>{ let L=lanes.findIndex(e=>e<=i.a); if(L<0){ L=lanes.length; lanes.push(0); } lanes[L]=i.b; i.lane=L; }); const NL=Math.max(1,lanes.length);
  return `<div class="dtl" style="height:${(H1-H0)*PX}px">${Array.from({length:H1-H0},(_,i)=>`<div class="dth" style="top:${i*PX}px"><span>${H0+i}:00</span></div>`).join('')}
    ${items.map(i=>`<button type="button" class="dti ${i.cls}" ${i.act} style="top:${(i.a/60-H0)*PX}px;height:${Math.max(22,(i.b-i.a)/60*PX-2)}px;left:calc(46px + (100% - 50px) * ${i.lane}/${NL});width:calc((100% - 50px) / ${NL} - 3px)"><b>${String(Math.floor(i.a/60)).padStart(2,'0')}:${String(i.a%60).padStart(2,'0')}</b> ${esc(i.label)}</button>`).join('')}</div>`; }

function openSearch(){
  openSheet(`<h3>さがす</h3><div class="search"><input id="q" type="search" placeholder="タスク名、案件名、メモ、経費で検索" aria-label="検索"></div><div id="qres" style="margin-top:12px"></div>`);
  const q=$('q'); setTimeout(()=>q.focus(),250);
  q.addEventListener('input',()=>{ const v=q.value.trim(); if(!v){ $('qres').innerHTML=''; return; }
    const r=S.tasks.filter(k=>{ const p=P(k.projectId); return [k.title,k.note,k.raw,p&&p.name,...(p?p.alias:[])].some(s=>s&&s.includes(v)); }).slice(0,30);
    const xs=(S.expenses||[]).filter(x=>[x.label,x.raw,x.acct].some(t=>t&&t.includes(v))).slice(0,20);
    $('qres').innerHTML=(r.length?list(r):'')+(xs.length?`<h3 style="margin:16px 0 8px;font-size:14px">経費</h3><ul class="mlist">${xs.map(x=>`<li class="mrow" data-act="${x.recurring===false?'expEdit':'expenses'}" data-eid="${x.id}"><div class="ml"><b>${esc(x.label)}</b><span>${x.date?md(fromIso(x.date)):'毎月'}　${esc(x.acct||'')}</span></div><div class="mr"><em>${yen(+x.amount)}</em></div></li>`).join('')}</ul>`:'')||'<div class="empty">見つかりませんでした。</div>'; });
}
